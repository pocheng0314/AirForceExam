        let filteredChoices = [];
        let filteredQAs = [];
        let filteredEssays = [];
        
        let activeChoices = [];
        let activeQAs = [];
        let activeEssays = [];
        
        let userChoices = [];
        let userQAs = [];
        let userEssays = [];

        // 初始化選單
        function init() {
            const stages = [...new Set(db.choices.map(q => q.stage))].sort();
            const stageSelect = document.getElementById('stage-select');
            stages.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                stageSelect.appendChild(opt);
            });
            
            updateSubjects();
            
            stageSelect.addEventListener('change', updateSubjects);
            document.getElementById('subject-select').addEventListener('change', updateCounts);
        }

        function updateSubjects() {
            const stage = document.getElementById('stage-select').value;
            const subjects = new Set();
            ['choices', 'qas', 'essays'].forEach(type => {
                db[type].forEach(q => {
                    if (stage === 'ALL' || q.stage === stage) subjects.add(q.subject);
                });
            });
            
            const subSelect = document.getElementById('subject-select');
            subSelect.innerHTML = '<option value="ALL">全部科目</option>';
            [...subjects].sort().forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                subSelect.appendChild(opt);
            });
            
            updateCounts();
        }

        function updateCounts() {
            const stage = document.getElementById('stage-select').value;
            const subject = document.getElementById('subject-select').value;
            
            const filterFn = q => (stage === 'ALL' || q.stage === stage) && (subject === 'ALL' || q.subject === subject);
            
            filteredChoices = db.choices.filter(filterFn);
            filteredQAs = db.qas.filter(filterFn);
            filteredEssays = db.essays.filter(filterFn);
            
            document.getElementById('max-choice').textContent = `題庫共 ${filteredChoices.length} 題`;
            document.getElementById('max-qa').textContent = `題庫共 ${filteredQAs.length} 題`;
            document.getElementById('max-essay').textContent = `題庫共 ${filteredEssays.length} 題`;
        }

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            const cReq = parseInt(document.getElementById('num-choice').value) || 0;
            const qReq = parseInt(document.getElementById('num-qa').value) || 0;
            const eReq = parseInt(document.getElementById('num-essay').value) || 0;
            
            if (cReq + qReq + eReq === 0) {
                alert('請至少選擇一題！');
                return;
            }

            // 1. 從 sessionStorage 讀取已考過的題目紀錄
            let used = JSON.parse(sessionStorage.getItem('usedQuestions')) || { choices: [], qas: [], essays: [] };

            // 2. 過濾掉已經考過的題目
            let availChoices = filteredChoices.filter(q => !used.choices.includes(q.content));
            let availQAs = filteredQAs.filter(q => !used.qas.includes(q.question));
            let availEssays = filteredEssays.filter(q => !used.essays.includes(q.question));

            // 3. 如果剩餘未考題目不夠這次抽題數量，就重置該題型的紀錄
            if (availChoices.length < cReq) { availChoices = filteredChoices; used.choices = []; }
            if (availQAs.length < qReq) { availQAs = filteredQAs; used.qas = []; }
            if (availEssays.length < eReq) { availEssays = filteredEssays; used.essays = []; }
            
            // 4. 從過濾後的題庫中抽題
            activeChoices = shuffle(availChoices).slice(0, cReq);
            activeQAs = shuffle(availQAs).slice(0, qReq);
            activeEssays = shuffle(availEssays).slice(0, eReq);
            
            // 5. 將這次抽到的題目加入紀錄中，並存回 sessionStorage
            used.choices.push(...activeChoices.map(q => q.content));
            used.qas.push(...activeQAs.map(q => q.question));
            used.essays.push(...activeEssays.map(q => q.question));
            sessionStorage.setItem('usedQuestions', JSON.stringify(used));

            userChoices = new Array(activeChoices.length).fill('');
            userQAs = new Array(activeQAs.length).fill('');
            userEssays = new Array(activeEssays.length).fill('');
            
            renderQuiz();
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            window.scrollTo(0,0);
        }
				
        function selectOption(qIdx, opt, btnObj) {
            userChoices[qIdx] = opt;
            const btns = btnObj.parentElement.querySelectorAll('.opt-btn');
            btns.forEach(b => b.classList.remove('selected'));
            btnObj.classList.add('selected');
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-content');
            container.innerHTML = '';
            
            // Choices
            if (activeChoices.length > 0) {
                container.innerHTML += `<h3 style="color:#1e3a8a; border-bottom:1px solid #e5e7eb; padding-bottom:5px;">一、選擇題</h3>`;
                activeChoices.forEach((q, idx) => {
                    let html = `<div class="question-block">
                        <div class="q-title">${idx + 1}. ${q.content} <span class="tag">${q.stage} | ${q.subject}</span></div>
                        <div class="options">`;
                    ['A', 'B', 'C', 'D'].forEach(opt => {
                        html += `<button class="opt-btn" onclick="selectOption(${idx}, '${opt}', this)">${opt}</button>`;
                    });
                    html += `</div></div>`;
                    container.innerHTML += html;
                });
            }
            
            // QAs
            if (activeQAs.length > 0) {
                container.innerHTML += `<h3 style="color:#166534; border-bottom:1px solid #e5e7eb; padding-bottom:5px; margin-top:30px;">二、問答題</h3>`;
                activeQAs.forEach((q, idx) => {
                    container.innerHTML += `
                    <div class="question-block">
                        <div class="q-title" style="color:#166534;">${idx + 1}. ${q.question} <span class="tag" style="background:#dcfce7; color:#166534;">${q.stage} | ${q.subject}</span></div>
                        <textarea id="qa-input-${idx}" placeholder="在此輸入解答要點 (或心中默答)..."></textarea>
                    </div>`;
                });
            }
            
            // Essays
            if (activeEssays.length > 0) {
                container.innerHTML += `<h3 style="color:#6b21a8; border-bottom:1px solid #e5e7eb; padding-bottom:5px; margin-top:30px;">三、申論題</h3>`;
                activeEssays.forEach((q, idx) => {
                    container.innerHTML += `
                    <div class="question-block">
                        <div class="q-title" style="color:#6b21a8;">${idx + 1}. ${q.question} <span class="tag" style="background:#f3e8ff; color:#6b21a8;">${q.stage} | ${q.subject}</span></div>
                        <textarea id="essay-input-${idx}" style="height: 150px;" placeholder="在此輸入申論重點 (或心中默答)..."></textarea>
                    </div>`;
                });
            }
        }

        function submitQuiz() {
            // Save text inputs
            activeQAs.forEach((_, idx) => {
                userQAs[idx] = document.getElementById(`qa-input-${idx}`).value;
            });
            activeEssays.forEach((_, idx) => {
                userEssays[idx] = document.getElementById(`essay-input-${idx}`).value;
            });
            
            // Grade choices
            let correctCount = 0;
            activeChoices.forEach((q, idx) => {
                if (userChoices[idx] === q.answer) correctCount++;
            });
            
            const score = activeChoices.length > 0 ? Math.round((correctCount / activeChoices.length) * 100) : 0;
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('score-detail').textContent = `選擇題答對 ${correctCount} 題 / 共 ${activeChoices.length} 題 (問答與申論請自行核對下方解答)`;
            
            renderResult();
            
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            window.scrollTo(0,0);
        }

        function renderResult() {
            const container = document.getElementById('result-content');
            container.innerHTML = '';
            
            // Choices
            if (activeChoices.length > 0) {
                container.innerHTML += `<h3 style="color:#1e3a8a; border-bottom:1px solid #e5e7eb; padding-bottom:5px;">一、選擇題</h3>`;
                activeChoices.forEach((q, idx) => {
                    let html = `<div class="question-block">
                        <div class="q-title">${idx + 1}. ${q.content}</div>
                        <div class="options">`;
                    ['A', 'B', 'C', 'D'].forEach(opt => {
                        let cls = "opt-btn disabled";
                        if (opt === q.answer) cls += " correct";
                        else if (userChoices[idx] === opt && opt !== q.answer) cls += " wrong";
                        
                        html += `<button class="${cls}">${opt}</button>`;
                    });
                    html += `</div>`;
                    if (userChoices[idx] !== q.answer) {
                        html += `<div style="color: #dc2626; font-weight: bold; margin-top: 10px; font-size: 14px;">❌ 錯誤，正確答案為 ${q.answer}</div>`;
                    }
                    html += `</div>`;
                    container.innerHTML += html;
                });
            }
            
            // QAs
            if (activeQAs.length > 0) {
                container.innerHTML += `<h3 style="color:#166534; border-bottom:1px solid #e5e7eb; padding-bottom:5px; margin-top:30px;">二、問答題</h3>`;
                activeQAs.forEach((q, idx) => {
                    let html = `
                    <div class="question-block">
                        <div class="q-title" style="color:#166534;">${idx + 1}. ${q.question}</div>`;
                    if (userQAs[idx].trim()) {
                        html += `<div style="color: #6b7280; font-size: 14px; font-weight: bold; margin-bottom: 5px;">📝 您的作答：</div>
                        <div style="background: #f9fafb; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 15px; white-space: pre-wrap;">${userQAs[idx]}</div>`;
                    }
                    html += `<div class="ans-box">
                            <h4 class="ans-title">✅ 標準解答</h4>
                            <p class="ans-text">${q.answer}</p>
                        </div>
                    </div>`;
                    container.innerHTML += html;
                });
            }
            
            // Essays
            if (activeEssays.length > 0) {
                container.innerHTML += `<h3 style="color:#6b21a8; border-bottom:1px solid #e5e7eb; padding-bottom:5px; margin-top:30px;">三、申論題</h3>`;
                activeEssays.forEach((q, idx) => {
                    let html = `
                    <div class="question-block">
                        <div class="q-title" style="color:#6b21a8;">${idx + 1}. ${q.question}</div>`;
                    if (userEssays[idx].trim()) {
                        html += `<div style="color: #6b7280; font-size: 14px; font-weight: bold; margin-bottom: 5px;">📝 您的擬答：</div>
                        <div style="background: #f9fafb; padding: 10px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 15px; white-space: pre-wrap;">${userEssays[idx]}</div>`;
                    }
                    html += `<div class="ans-box-essay">
                            <h4 class="ans-title" style="color: #6b21a8;">📚 參考解答 / 頁數</h4>
                            <p class="ans-text">${q.answer}</p>
                        </div>
                    </div>`;
                    container.innerHTML += html;
                });
            }
        }

        window.onload = init;
    </script>
</body>
</html>
