<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空軍士高題庫離線測驗（純選擇題版）</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 16px; }
        .container { max-width: 820px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2563eb; border-bottom: 2px solid #bfdbfe; padding-bottom: 12px; margin-top: 0; font-size: 24px; }
        h2 { color: #1e3a8a; border-bottom: 2px solid #bfdbfe; padding-bottom: 10px; margin-top: 0; font-size: 20px; }
        
        .setup-section { margin-bottom: 18px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; color: #374151; font-size: 15px; }
        select, input { width: 100%; padding: 11px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; }
        
        .btn-group { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 140px; background: #2563eb; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-secondary { background: #0d9488; }
        .btn-secondary:hover { background: #0f766e; }
        .btn-submit { background: #16a34a; width: 100%; margin-top: 24px; }
        .btn-submit:hover { background: #15803d; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
        .header-btn { background: #6b7280; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .header-btn:hover { background: #4b5563; }

        .question-block { border-bottom: 1px solid #e5e7eb; padding: 18px 0; }
        .question-block:last-child { border-bottom: none; }
        .q-meta { margin-bottom: 8px; }
        .tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 6px; }
        .ans-badge { display: inline-block; background: #dcfce7; color: #166534; border: 1px solid #86efac; padding: 3px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .q-title { font-size: 17px; font-weight: bold; margin-bottom: 12px; color: #111827; line-height: 1.6; }
        
        .options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        @media (max-width: 520px) { .options { grid-template-columns: repeat(2, 1fr); } }
        .opt-btn { padding: 12px; border: 2px solid #e5e7eb; background: white; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.15s; text-align: center; }
        .opt-btn.selected { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
        .opt-btn.correct { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
        .opt-btn.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }

        .study-options { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .study-opt { padding: 8px 12px; border-radius: 6px; background: #f9fafb; border: 1px solid #e5e7eb; font-size: 15px; line-height: 1.5; }
        .study-opt.is-answer { background: #f0fdf4; border-color: #22c55e; color: #15803d; font-weight: bold; }

        .score-display { text-align: center; font-size: 42px; font-weight: bold; color: #16a34a; margin: 16px 0 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container" id="setup-screen">
        <h1>空軍士高題庫（選擇題）</h1>
        
        <div class="setup-section">
            <label for="stage-select">1. 選擇階段</label>
            <select id="stage-select">
                <option value="ALL">全部階段綜合</option>
            </select>
        </div>
        
        <div class="setup-section">
            <label for="subject-select">2. 選擇科目</label>
            <select id="subject-select">
                <option value="ALL">全部科目</option>
            </select>
        </div>
        
        <div class="setup-section">
            <label for="num-choice">3. 測驗題數</label>
            <input type="number" id="num-choice" value="40" min="1">
            <div style="font-size: 13px; color: #6b7280; margin-top: 6px;" id="max-choice">計算中...</div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="openStudyMode()">📖 先看題庫與解答</button>
            <button class="btn" onclick="startQuiz()">✍️ 開始模擬測驗</button>
        </div>
    </div>

    <div class="container hidden" id="study-screen">
        <div class="header-bar">
            <button class="header-btn" onclick="showScreen('setup-screen')">← 返回首頁</button>
            <button class="btn" style="padding: 8px 16px; font-size: 14px; flex: none;" onclick="startQuiz()">看完了，直接開始測驗 →</button>
        </div>
        <h2 id="study-title">題庫與解答總覽</h2>
        <div class="setup-section">
            <input type="text" id="study-search" placeholder="🔍 輸入關鍵字搜尋題目或選項..." oninput="renderStudyList()">
        </div>
        <div id="study-count" style="font-size: 13px; color: #6b7280; margin-bottom: 10px;"></div>
        <div id="study-content"></div>
    </div>

    <div class="container hidden" id="quiz-screen">
        <div class="header-bar">
            <button class="header-btn" onclick="showScreen('setup-screen')">← 重新設定</button>
            <span id="quiz-progress" style="font-size: 14px; font-weight: bold; color: #4b5563;"></span>
        </div>
        <h2>測驗進行中</h2>
        <div id="quiz-content"></div>
        <button class="btn btn-submit" onclick="submitQuiz()">交卷並核對解答</button>
    </div>

    <div class="container hidden" id="result-screen">
        <div class="header-bar">
            <button class="header-btn" onclick="showScreen('setup-screen')">← 返回首頁</button>
            <button class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px; flex: none;" onclick="startQuiz()">同範圍再考一次</button>
        </div>
        <h2>測驗結算</h2>
        <div class="score-display">
            得分：<span id="final-score">0</span> <span style="font-size: 22px; color: #6b7280;">/ 100</span>
        </div>
        <p style="text-align: center; color: #4b5563; margin-bottom: 24px; font-weight: bold;" id="score-detail"></p>
        <div id="result-content"></div>
    </div>

    <script>
        const cleanDB = [{"stage":"第一階段","subject":"機隊管理概論","q_num":"1","answer":"A","content":"「擇要檢修（IRAN）」係屬於哪一修護階層？（A）D/L（B）I/L（C）O/L（D）C/L"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"2","answer":"A","content":"以下何者非屬ASIP飛機生命週期之必要項目？（A）販售（B）測試（C）需求（D）製造"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"3","answer":"A","content":"以下何者非屬試驗階段應涵蓋的試驗組件？（A）座艙插銷（B）主起落架（C）機身（D）以上皆是"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"4","answer":"B","content":"以下何者非屬「機隊管理」結構維修策略之優點？（A）現代化後勤管理作為（B）結構維修需求固定（C）機動性結構修護策略（D）以上皆 是"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"5","answer":"B","content":"以下何項資訊能運用於機隊管理發展？（A）每日天氣概況（B）飛行負載試驗數據（C）資安系統運作情況（D）以上皆非"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"6","answer":"B","content":"以下何者非屬飛機生命週期運作計畫主要程序？（A）需求（B）督導（C）製造（D）設計"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"7","answer":"C","content":"以下何者曾造成B-47 轟炸機之機身結構最大致命傷？（A）腐蝕（B）材料疲勞（C）以上皆是（D）以上皆非"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"8","answer":"C","content":"以下何者為實施結構整合計畫（ASIP）之涵蓋工作範圍？（A）工程（B）後勤（C）以上皆是（D）以上皆非"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"9","answer":"D","content":"以下何者為機隊管理研究包含的主軸工程？（A）飛機單機追蹤（B）結構維修計畫（C）負載環境譜驗證（D）以上皆是"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"10","answer":"D","content":"以下何者為試驗階段應涵蓋的試驗組件？（A）機翼（B）機身（C）垂直尾翼（D）以上皆是"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"11","answer":"A","content":"以下何者非屬機隊管理階段（服役階段）運用範疇？（A）資安系統運作情況（B）修訂結構維修需求（C）執行必要的結構維修行動（D）持 續追蹤每架飛機使用情況"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"12","answer":"A","content":"「擇要檢修（IRAN）」係依據哪一階段分析與試驗結果，訂定結構維修需求？（A）設計階段（B）測試階段（C）製造階段（D）執行階段"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"13","answer":"B","content":"以下何者屬於飛機生命週期運作計畫程序？（A）販售（B）設計（C）履約（D）交換"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"14","answer":"C","content":"機隊管理流程中，全程發展階段（FSD）依據設計使用、分析與測試結果，主要係訂定何計畫？（A）修護管制維保計畫（B）品質標準審查計 畫（C）初期機隊結構維修計畫（D）以上皆非"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"15","answer":"B","content":"以下何者非屬「設計分析與發展試驗階段」所執行項目？（A）聲振分析（B）靜力試驗（C）應力分析（D）容損分析"},{"stage":"第一階段","subject":"機隊管理概論","q_num":"16"," 度。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"12","answer":"C","content":"工場安全檢查管理委員會視各單位特性及編組狀況設置之，委員不得少於？（A）5（B）6（C）7（D）8人。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"13","answer":"C","content":"危害工廠安全之因素中人的因素排除方法包括３E 策略，何者為非？（A）工程 Engineering（B）教育 Education（C）裝備 Equipment（D） 執行Execute。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"14","answer":"B","content":"下列哪一個不是5S推動的四個階段？（A）考核（B）教育（C）計畫（D）執行。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"15","answer":"B","content":"安全與衛生檢查，不是檢查之時間區分哪一項？（A）定期檢查（B）事故檢查（C）特別檢查（D）經常檢查。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"16","answer":"B","content":"5S 基本定義何者為錯？（A）紀律-規範（B）整理-整頓定位（C）清掃-清除汙塵（D）清潔-保持乾淨。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"17","answer":"D","content":"空軍修護手冊修護安全管理規定，各級主官（管）及工作人員，務須各視其工作環境？（A）嚴格遵守相關之安全規定及工作程序（B）應確 實遵守各類相關技術命令、技術手冊所註明之安全措施（C）以上皆非（D）以上皆是。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"18","answer":"A","content":"一件事情如果可能發生錯誤，它就會發生錯誤是何種定律？（A）墨菲定律（B）起司定律（C）達爾文定律（D）牛頓定律。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"19","answer":"D","content":"噪音會使人精神活動感到不適，工作場所中強烈之噪音會導致工人聽力受損，人員須配帶 ？（A）耳罩（B）通話器（C）耳塞（D）以上皆 是。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"20","answer":"C","content":"工作四周之設備或裝置等之不安全情況，包括機器設備之因素及環境之因素是屬於？（A）環境因素（B）機器設備因素（C）不安全工作環境 （D）不安全的個人因素。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"21","answer":"D","content":"運用管理之原則與方法，於有限之人力、物力與財力下經營工廠，並使工廠之各項要素能夠有效地配合發展，以順利達成工廠之目標是 ？ （A）工廠運轉定義（B）工廠管理循環（C）工廠管理目的（D）工廠管理意義。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"22","answer":"D","content":"危害工廠安全之工作因素有哪些？（A）工業知識的不足（B）工作方法的不適當（C）工作速度的不適當（D）以上皆是。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"23","answer":"C","content":"下列哪一個是無謂的浪費？（A）通風不良（B）生產程序不合理（C）設備保養不周，發生故障的損失（D）工作場所空間不足。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"24","answer":"D","content":"選擇所要分析的工作是工作安全分析直接實現了事故預防工作安全分析第幾個步驟？（A）步驟四（B）步驟三（C）步驟二（D）步驟一。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"25","answer":"D","content":"針對危害發生之因素，提出消除或防止危害之發生方案，以決定解決之方法是工作安全分析直接實現了事故預防工作安全分析第幾個步驟 ？ （A）步驟一（B）步驟二（C）步驟三（D）步驟四。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"26","answer":"B","content":"列出工作步驟，在尋找危害之前，先將工作按照次序，列出步驟是工作安全分析直接實現了事故預防工作安全分析第幾個步驟？（A）步驟一 （B）步驟二（C）步驟三（D）步驟四。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"27","answer":"C","content":"事故發生之原因大致可歸納為環境及人為方面兩大因素，其中人為因素所造成之意外事故，所佔比例高達？（A）77%（B）66%（C）88%（D） 85%。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"28","answer":"B","content":"關係著勞工最基本生存權與工作權之保障，亦關係著人力資源之維護、社會之安定及經濟之發展係指 ？（A）工廠管理定義（B）工廠安全 （C）工廠管理意義（D）工廠管理循環。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"29","answer":"C","content":"營養不良、體力欠佳或身體上有缺陷、癱病失眠或酒醉及其他麻醉的作用是指？（A）家庭因素（B）環境因素（C）生理上的因素（D）心理 因素。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"30","answer":"A","content":"等待零件到達或機器加工中之等待時間之浪費是指？（A）等待之浪費（B）搬運之浪費（C）無謂的浪費（D）再製或返修的浪費。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"31","answer":"D","content":"工作安全分析步驟一選擇所要分析的工作，應考慮下述各項因素？（A）事故率（B）失能傷害（C）具有潛在嚴重性（D）以上皆是。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"32","answer":"A","content":"有些工作雖然尚未發生事故，但因為存在著潛在重大危害，必須立刻進行安全分析係指？（A）專業的判斷（B）工作的改變（C）具有潛在嚴 重性（D）工作的經常性。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"33","answer":"D","content":"下列哪些是機器設備因素？（A）缺乏安全防護裝置或措施（B）保養不良，未實施定期檢查（C）未使用正確之方法操作（D）以上皆是。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"34","answer":"D","content":"下列何者不是環境因素？（A）有毒氣體及塵埃粉末（B）通風不良（C）噪音（D）未使用正確之方法操作。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"35","answer":"A","content":"下列何者不是不安全的個人因素？（A）噪音（B）粗心（C）不知（D）不顧。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"36","answer":"A","content":"各單位工場安全檢查業管部門或工場安全檢查管理員，依據前述各項檢查執行紀錄，將檢查缺點及有危及安全之事項需填寫何種通知單 ？ （A）CAFM 0071表（B）CAFM 781表（C）CAFM 0001表（D）CAFM 349A表。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"37","answer":"C","content":"空軍司令部後勤處配合政府勞工安全衛生政策辦理『勞工安全衛生宣導週』何時舉辦？（A）每2 年（B）每半年（C）每年（D）每季。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"38","answer":"D","content":"下列何者辦理『勞工安全衛生宣導週』的內容？（A）工場安全競賽（B）工場安全論文比賽（C）張貼工場安全標語（D）以上皆是。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"39","answer":"D","content":"工廠安全管理（A）不僅是工廠管理上之一種措施或手段（B）反映出一個組織的文化、傳統、理念與價值觀（C）最少需明訂出操作安全維護 的權責、組織資源的分配及組織對安全的態度與支持（D）以上皆是。"},{"stage":"第一階段","subject":"工廠實務暨修護安全管理","q_num":"40","answer":"D","content":"各單位除應隨時檢查機具、裝備之安全操作程序與改善工作環境外，對下列事項並應有必要之安全防制 ？（A）防止機械、器具、設備（B） 防止裝卸、堆積（C）防止爆炸性（D）以上皆是。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"1","answer":"A","content":"何種顧客是指受到某一產品影響的人，但並非屬於生產此產品公司之成員？（A）外部（B）內部（C）中間（D）公部門。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"2","answer":"B","content":"美國學者Garvin提出衡量產品/服務共有幾個品質構面？（A）7 個（B）8 個（C）9 個（D）10 個。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"3","answer":"A","content":"何者是指產品的主要操作特性，它是用來衡量一件產品/服務是否能達成原本想要完成的工作？（A）性能（B）特色（C）可靠度（D）符合 性。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"4","answer":"B","content":"何者是指補充一件產品/服務之基本功能以外的特性？（A）性能（B）特色（C）可靠度（D）符合性。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"5","answer":"C","content":"何者是指一件產品/服務在一個指定時間內，會失效的機率？（A）性能（B）特色（C）可靠度（D）符合性。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"6","answer":"D","content":"何者是指產品/服務的設計和操作特性能夠符合公認標準（預設標準）的能力？（A）性能（B）特色（C）可靠度（D）符合性。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"7","answer":"A","content":"何者是衡量產品的有效壽命？（A）耐久性（B）服務性（C）美感（D）性能。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"8","answer":"B","content":"何者是指服務速度、禮貌、價格之競爭性和修理（復）的容易程度？（A）耐久性（B）服務性（C）美感（D）性能。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"9","answer":"C","content":"何者指的是一件產品或服務外表、給人的感覺、聽起來的感覺、味道及嗅覺等？（A）耐久性（B）服務性（C）美感（D）性能。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"10","answer":"C","content":"品管七大手法中特性要因圖又稱？（A）柏拉圖（B）直方圖（C）魚骨圖（D）管制圖。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"11","answer":"C","content":"（A）直方圖（B）柏拉圖（C）魚骨圖（D）管制圖 係一個問題的特性（結果）受一些要因（原因）的影響時，將這些要因加以整理，成為 相互關聯而有條理的圖形。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"12","answer":"A","content":"（A）查檢表（B）柏拉圖（C）魚骨圖（D）管制圖 係以一種簡單的方法將問題查檢出來的表格或圖。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"13","answer":"B","content":"（A）查檢表（B）柏拉圖（C）魚骨圖（D）管制圖 係根據蒐集的數據，以各種不良因素項目別分類，計算出各分類項目所佔之比例而按照 大小順序排列，再加上累積值的圖形。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"14","answer":"A","content":"（A）直方圖（B）柏拉圖（C）魚骨圖（D）管制圖 在某條件下，搜集很多數據，藉以調查數據的中心值及差異的情形。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"15","answer":"D","content":"（A）直方圖（B）柏拉圖（C）魚骨圖（D）散佈圖 可將相對應的兩組數據，分別依X 軸及Y 軸點入座標圖中，以觀測兩組數據間是否相關 及其相關程度。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"16","answer":"B","content":"（A）直方圖（B）層別法（C）柏拉圖（D）管制圖 是針對部門、人、工作方法、原材料、零件、設備、地點等，分別蒐集數據以找出其間 之差異，針對差異加以改善的方法。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"17","answer":"D","content":"（A）魚骨圖（B）柏拉圖（C）直方圖（D）管制圖 一種用於調查製造程序是否在穩定狀態下，或者維持製造程序在穩定狀態下所用的圖。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"18","answer":"C","content":"六標準差係以何種符號表示？（A）6Ω（B）6θ（C）6σ（D）6Φ。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"19","answer":"D","content":"（A）真誠關心顧客（B）根據資料和事實管理（C）以流程為重（D）主動管理 係指企業必須時常主動去做那些一般公司常忽略的事情。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"20","answer":"A","content":"本軍（A）品質管制政策（B）品質保證政策（C）品質檢驗政策（D）品質改善政策 旨在為本軍各使用部隊之品質管制與可靠度提昇等作為 制訂指導方針。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"21","answer":"C","content":"本軍品質政策採（A）失效性（B）補救性（C）預防性（D）投機性 及改正性措施，著重於「事前預防錯誤之發生、非賴事後之檢查糾正。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"22","answer":"A","content":"何種部門乃修護單位中主要技術輔導單位？（A）品管（B）檢驗（C）專業（D）管理。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"23","answer":"B","content":"（A）國防部（B）空軍司令部（C）教準部（D）聯隊 負責全軍修護品質政策之指導與督考。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"24","answer":"C","content":"（A）國防部（B）空軍司令部（C）保指部（D）聯隊 負責本軍各項修護品質技術業務之考核與輔導。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"25","answer":"D","content":"擔任新任品管或檢驗人員訓練教官應具備下列何者條件？（A）從事本職修護五年以上（B）執行品管工作一年以上經歷或持有相關專業證照 （C）由品管及檢驗人員甄選委員會甄選及任用（D）以上皆是。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"26","answer":"C","content":"何單位應建立完整之品質檢驗人員名冊與相關之考核資料，以供各級主官作為人員經管及考績評比之參考 ？（A）修管（B）補管（C）品管 （D）後勤 單位。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"27","answer":"A","content":"各部隊應成立「品管及檢驗人員甄選委員會」，應由何者擔任主任委員？（A）修補大隊長（B）修補副大隊長（C）品標科科長（D）中隊 長。"},{"stage":"第二階段","subject":"空軍品質管理","q_num":"28","answer":"C","content _num":"4","answer":"B","content":"裝備編配基準修（增）訂作業，配合保修指揮部「裝備審查委員會」，於每年（A）1、7（B）2、8（C）3、9（D）4、10 月份各辦理乙次， 惟基地／專業緊急裝備配賦需求，不在此限。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"5","answer":"D","content":"（A）保修（B）翻修（C）維修（D）拼修 係指經檢定為不合經濟修復價值或已報廢之主件，拆卸其堪用總成或零件，作為零件補給來源之 方式。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"6","answer":"C","content":"裝備清點週期為（A）每季（B）每半年（C）每年（D）每二年 實施，並採一次全面實物清點為原則。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"7","answer":"D","content":"（A）野戰保修（B）單位保養（C）場站保修（D）基地翻修 屬於修護體系中最高階層。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"8","answer":"A","content":"報廢裝備（Condemned Equipment）係已不能修復，或修理費用（包括材料與人工）超過裝備最大修理容許值，即裝備新品價格之（A）65% （B）70%（C）75%（D）80% 以上者，即不宜再予修復，應循裝管程序予以報廢處理。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"9","answer":"B","content":"修復性作業是屬於修護體系中哪一種？（A）野戰保修（B）基地翻修（C）場站保修（D）單位保養。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"10","answer":"A","content":"裝備清點週期，以多久清點一次，並採一次全面實物清點為原則？（A）1 年（B）2 年（C）3年（D）4年。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"11","answer":"A","content":"修護機構、設施、裝備、人力及技術等之修理能力（功能）？（A）修護能量（B）修理能量（C）校驗能量（D）修妥能量。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"12","answer":"D","content":"各軍種基於任務及作戰需求，建立之軍種為何裝備？（A）單用裝備（B）專門裝備（C）通用裝備（D）專用裝備。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"13","answer":"A","content":"兩個軍種以上通用性裝備，亦即配賦不同軍種之同一類型裝備，是何種裝備？（A）通用裝備（B）專門裝備（C）專用裝備（D）單用裝備。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"14","answer":"A","content":"為保修體系之基礎，通常包括檢查、清潔、潤滑、調整（校）、消耗料件、次要零件或次總成之更換稱為（A）單位保養（B）裝備（C）妥 善（D）待修。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"15","answer":"A","content":"經檢定為不合經濟修復價值或已報廢之主件，經品管鑑濾後繳庫納儲，作為零件補給來源之方式。（A）拼修（B）拆裝（C）拆解（D）拆 併。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"16","answer":"D","content":"凡兩種以上裝備，其所具有之物理特性與功能，在效果與耐久性方面部份相同，惟僅能在某種情況下，或特殊應用時始可互換使用，故該項 裝備通常僅具有單向代用性。（A）主要項目（B）經常需要項目（C）互換項目（D）代用項目。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"17","answer":"A","content":"對實施修護（整修、翻修或大修）後裝備之試驗，以決定修護過程之品質水準，並應核證該項裝備符合相關規範之程度（A）修復試驗（B） 拆裝（C）拆解（D）拆併。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"18","answer":"D","content":"按適用之技令執行各系統/裝備零、組件之拆卸、清洗、檢查、修理、更換、重裝配、測試等工作，以提供使用操作上安全可靠（A）拼修 （B）拆裝（C）拆解（D）翻修。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"19","answer":"A","content":"係以定期與計畫為基礎，就已知工作負荷，排定優先次序，有效運用編配之人力及修護能量執行之修護工作（A）計畫性修護（B）一般修護 （C）校驗能量（D）修護能量。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"20","answer":"A","content":"由待修件處理中心，送工廠（場）作工作檯檢試或修理之附件，此工作屬（A）裝備外修護工作（B）裝備內修護工作（C）裝備外修理工作 （D）裝備內修理工作。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"21","answer":"C","content":"裝備使用不當或缺乏預防保養，因而導致損壞裝備之事實，應按何規定辦理疏失責任檢討後，候令施修？（A）國軍財產管理作業規定（B） 軍品及軍用器材管理作業規定（C）以上皆是（D）以上皆非。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"22","answer":"A","content":"裝備使用單位屬本軍裝備帳籍哪一階層管理？（A）第一階層（B）第二階層（C）第三階層（D）第四階層。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"23","answer":"B","content":"基地裝備管理單位或後勤指揮部補支科裝管單位屬本軍裝備帳籍哪一階層管理？（A）第一階層（B）第二階層（C）第三階層（D）第四階 層。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"24","answer":"C","content":"空軍保修指揮部補管組屬本軍裝備帳籍哪一階層管理？（A）第一階層（B）第二階層（C）第三階層（D）第四階層。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"25","answer":"A","content":"經由電子計算機之處理以掌管全軍之裝備管理業務，負責全軍裝備帳籍管理之單位為（A）空軍保修指揮部補管組（B）基地裝備管理室 （C）專業裝備管理單位（D）使用單位。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"26","answer":"B","content":"隸屬於基地修補大隊，負責基地內受其支援之各使用單位 UAL 裝備管理業務之單位為（A）空軍保修指揮部補管組（B）基地裝備管理室 （C）專業裝備管理單位（D）使用單位。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"27","answer":"C","content":"屬專業修護支援單位之機構，負責該專業單位所屬各使用單位UAL 裝備管理業務之單位為（A）空軍保修指揮部補管組（B）基地裝備管理室 （C）專業裝備管理單位（D）使用單位。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"28","answer":"D","content":"直接受空軍基地補給單位或相當之補給單位支援之單位，通常以中隊或廠為基本單位，於 UAL 裝備管理業務中係屬（A）空軍保修指揮部補 管組（B）基地裝備管理室（C）專業裝備管理單位（D）使用單位。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"29","answer":"B","content":"凡 AF-158表所列裝備項目，核定量大於現有量之裝備，是為（A）超量裝備（B）缺量裝備（C）以上皆是（D）以上皆非。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"30","answer":"A","content":"凡 AF-158表所列裝備項目，核定量小於現有量之裝備，是為（A）超量裝備（B）缺量裝備（C）以上皆是（D）以上皆非。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"31","answer":"C","content":"不可使用之裝備及零附件，由權責品質管制單位鑑定，經確定無修理價值者，應按何種規定辦理？（A）軍品及軍用器材管理作業規定（B） 國軍廢舊及不適用物資處理作業規定（C）以上皆是（D）以上皆非。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"32","answer":"A","content":"裝備編配基準修（增）訂作業，應配合保修指揮部 “裝備審查委員會”何時召開乙次？（A）每年二、八月（B）每年三、九月（C）每年 四、九月（D）每年二、十月。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"33","answer":"D","content":"裝備清點週期應為多久實施並採一次全面實物清點為原則？（A）每月（B）每季（C）每半年（D）每年。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"34","answer":"A","content":"裝備使用前後，依據各類裝備保養手冊執行每日、每週、每月、每季、每半年、每年等週期性或里程、時數使用循環數之定期保養檢查勤 務，是為（A）預防保養檢查（B）修護（C）野戰（場站）保修（D）基地（工廠）翻修。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"35","answer":"B","content":"對已故障裝備之拆卸、檢查、換件、調整與測試，使之恢復可用狀態，是為（A）預防保養檢查（B）修護（C）野戰（場站）保修（D）基地 （工廠）翻修。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"36","answer":"C","content":"由地區保修單位負責，以支援單位保養，通常包括鑑定檢查、總成、次總成修理及更換，是為（A）預防保養檢查（B）修護（C）野戰（場 站）保修（D）基地（工廠）翻修。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"37","answer":"D","content":"屬於修護體系最高階層，對後送不堪使用而可修復之主件、總成、次總成、零件等，執行專業修復性工作，是為（A）預防保養檢查（B）修 護（C）野戰（場站）保修（D）基地（工廠）翻修。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"38","answer":"C","content":"指裝備各部機件或總成均能保持 全功能與標準之運作，而使裝備得以發揮應有之戰力，是為（A）通用裝備（B）專用裝備（C）妥善裝備 （D）停用裝備。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"39","answer":"D","content":"依裝備檢查手冊，凡有一項（含以上）屬嚴重不合格項目者，是為（A）通用裝備（B）專用裝備（C）妥善裝備（D）停用裝備。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"40","answer":"C","content":"通用裝備之基地（工廠）修護能量，原則採何者方式，由民間廠商負責籌建，以達節約投資之目標。（A）共同投資（B）單位自修（C）商 維（D）以上皆非。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"41","answer":"D","content":"裝備編配最低基準修（增）訂作業，由使用單位檢討提出，並於（A）每年第二季（B）每年第三季（C）每年 6 月底（D）每年 2 月底 前召 開「基地裝備配賦審查委員會」審查使用單位配賦修訂需求。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"42","answer":"B","content":"裝備編配基準修（增）訂作業、配合司令部層級「全軍裝備審查委員會」，定期於逢 5 之倍數年之幾月份辦理？（A）2（B）6（C）8（D） 10 月份修訂，惟基地/專業緊急裝備配賦需求，不再此限。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"43","answer":"B","content":"裝備管理組織階層劃分，空軍保修指揮部屬下列何補給組織階層？（A）執行階層（B）計畫、管理、督導階層（C）政策、督導階層（D）以 上皆是。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"44","answer":"D","content":"（A）修護工作（B）修護管理（C）裝備修護（D）裝備管理 係基於裝備本身之特性，及其對各單位任務之重要性而實施的一種補給管理， 為補給管理之一部分。"},{"stage":"第二階段","subject":"國軍裝備保養修護作業","q_num":"45","answer":"A","content":"不論新件或舊件裝備，宜於撥發作為原定用途之裝備，稱為（A）可用裝備（B）待修裝備（C）缺件裝備（D）報廢裝備。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"1","answer":"D","content":"下列何種選項非包含在「本軍時限技令」範圍內？（A）F-16 型機（B）天劍二型飛彈（C）二案合約之裝備與附件（D）中型戰術輪車。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"2","answer":"C","content":"本軍時限技令共計有兩種文件發佈方式，下列何者正確？（A）電報技令、光碟技令（B）電話技令、光碟技令（C）文件技令、電報技令 （D）文件技令、光碟技令。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"3","answer":"D","content":"下列何種非本軍時限技令之執行分類？（A）立即執行、緊急執行、一般執行（B）刻正執行、時限執行、經常執行（C）經常執行、暫時執 行立即執行（D）立即執行、經常執行、緊急執行。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"4","answer":"C","content":"基於作戰之需要，或潛在之各種危險情況而頒發之時限技令，係屬於何種執行分類？（A）刻正執行（B）立即執行（C）緊急執行（D）限 期執行。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"5","answer":"B","content":"為使受影響之武器/裝備能及時執行所需修改及檢查工作，哪兩種分類之安全時限技令，可以先採電報技令方式 傳遞？（A）刻正執行、緊 急執行（B）立即執行、緊急執行（C）限期執行、緊急執行（D）限期執行、經常執行。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"6","answer":"A","content":"請問針對何種類別之時限技令，保修指揮部（整後組）除需採「電報技令」即時傳遞受影響單位，亦須要求其在 24 小時內完成 CCB 審查 會，且教準部技令處應於 24 小時內補以複製文件？（A）停飛類及安全類（B）飛危類及安全類（C）缺點類、停飛類（D）結構類、停飛 類。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"7","answer":"B","content":"本軍時限技令依其修改特性共區分幾類？（A）7類（B）5 類（C）8類（D）4 類。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"8","answer":"A","content":"C-130 型運輸機配合「人工增雨」任務需求，所安裝之人工增雨灑水裝備屬於時限技令裡第幾類修改？（A）第一類（B）第二類（C）第三 類（D）第四類。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"9","answer":"B","content":"倘若現今本軍有一型戰機面臨屆壽汰除，而本軍為驗證無人控制技術發展並滿足靶機需求，預劃將其構改為無人靶機，那此類修改應屬於 時限技令第幾類修改？（A）第一類（B）第二類（C）第五類（D）第四B 類。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"10","answer":"B","content":"倘若現今本軍因應環保政策要求，所屬裝備及零附件生產全面改採使用環保材質之材料，並嚴禁使用有毒材料（如鉻之重金屬等），那此 類修改應屬於時限技令哪一類修改？（A）第二類（B）第三類（C）第四B 類（D）第四A 類。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"11","answer":"C","content":"「為改進缺點，以確保任務達成或改進裝備性能，增進使用壽命與維護效能者」係屬於本軍時限技術命令哪一類修改？（A）第二類（B） 第三類（C）第四B類（D）第四A類。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"12","answer":"C","content":"倘若現今本軍有一型戰機需要執行航電及電戰系統之構型 更改，增加裝備效能以適應新式戰場，那此類修改應屬於時限技令第幾類修改？ （A）第四A類（B）第三類（C）第五類（D）第四B類。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"13","answer":"D","content":"本軍若接收到正式之時限技令文件，應由本軍下列何種單位按其類別於時限內印製分送各單位？（A）保指部整後組（B）司令部後勤處 （C）保指部修護組（D）教準部技令處。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"14","answer":"D","content":"本軍時限技術命令的第一類修改係指飛機因任務需要，以不影響飛機原有構型情況下，而臨時加裝或拆除其裝備。而請問此種裝備之臨時 拆除或加裝，需要能於幾小時內裝回或拆除，以恢復原有構型？（A）12 小時（B）24 小時（C）36小時（D）48小時。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"15","answer":"A","content":"教準部技令處每日應至美國聯邦航空署（FAA）及歐洲飛航安全局（EASA）網站查詢何種發布情況？（A）適航指令（B）飛安通報（C）不 滿意報告（D）品質缺點報告。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"16","answer":"C","content":"下列何種商購工程修改技術文件選項之中文名稱與其英文縮寫正確？（A）適航性指令 AD、服務通報 SB、服務說明 SS、顧客服務通報 CCN （B）適航性指令 AD、服務通報 SI、服務說明 SB、顧客服務通報 CSN（C）適航性指令 AD、服務通報 SB、服務說明 SI、顧客服務通報 CSN （D）適航性指令AO、服務通報SB、服務說明SI、顧客服務通報CSN。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"17","answer":"C","content":"下列何者不是本軍自頒時限技令時機？（A）臨時特殊需要對武器/裝備進行第 1 類臨時修改者（B）廠商提供技術文件由本軍執行檢查者 （C）本軍因飛機失事或危安事件而實施之停飛檢查（D）以上皆非。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"18","answer":"C","content":"本軍時限技令之第五類修改係為改進操作性能，或增加裝備效能而進行重大修改之工作，請問此類修改需呈報何處經奉核定後實施？（A） 國防部（B）教準部（C）空軍司令部（D）保修指揮部。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"19","answer":"D","content":"下列單位何者負責時限技令器材包之儲存？（A）司令部（B）教準部（C）保修指揮部（D）料配件總庫。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"20","answer":"B","content":"教準部技令處於分配時限技令文件 時，應依據何種數量印製分配至受影響機種之部隊及指揮部？（A）配賦量（B）預約量（C）現有量 （D）各單位自提需求。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"21","answer":"A","content":"本軍接獲時限技令後，應各由哪些單位成立時限技令審查管制委員會，以負責時限技令及工程修改建議之審查及管制？（A）保修指揮部與 各使用（或支援）武器/裝備之單位（B）空軍司令部與各使用（或支援）武器/裝備之單位（C）教準部與各使用（或支援）武器/裝備之單 位（D）空軍司令部與保修指揮部。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"22","answer":"D","content":"本軍接獲時限技術命令，保修指揮部依規定須成立空軍時限技令審查管制委員會（Configuration Control Board；CCB），而該CCB係設於 保修指揮部哪個單位？（A）修護組（B）補管組（C）後資組（D）整後組。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"23","answer":"C","content":"本軍接獲時限技術命令，各受影響之使用（或支援）武器/裝備單位依規定須成立空軍時限技令審查管制委員會（Configuration Control Board；CCB），而該 CCB 係設於受影響之使用（或支援）武器/裝備單位哪個部門？（A）品質管制部門（特業單位於補給管制部門）（B） 補給管制部門（特業單位於修護管制部門）（C）品質管制部門（特業單位於修護管制部門）（D）修護管制部門（特業單位於品質管制部 門）。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"24","answer":"A","content":"若美軍或其他國內（外）製造廠商，以某種理由不同意本軍執行某項修改時，應主動詳究其原因檢討決定，但對影響安全或本軍作戰任務 需要之時限技令，仍應（A）據理力爭或簽報請核示（B）暫緩處理（C）不予理會（D）遵照美軍或其他國內（外）製造廠商決定。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"25","answer":"B","content":"本軍時限技令之器材管制，如按時限技令文件內所述之撥補期限，請問逾執行期限超過幾天，仍未獲得器材或其撥補通知單時，保修指揮 部時限技令器材管制單位應洽美軍或其他國內（外）製造廠商催詢？（A）100天（B）90 天（C）180天（D）200天。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"26","answer":"C","content":"本軍執行時限技令之所需器材（包），請問在時限技令廢止日期幾天前，仍尚未獲得（或撥補通知）時，各基地時限技令器材管制單位應 立即反映基地時限技令管制單位，併提報保修指揮部時限技令管制單位，專案檢討解決？（A）100 天（B）90 天（C）180天（D）200天"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"27","answer":"D","content":"基地時限技令審查管制委員會（基地 CCB）應定期及視需要臨時召開會議，請問定期召開頻率及相對應主持長官下列何者正確？（A）每月 （修管科科長主持），每季（修補大隊長主持）（B）每月（修管科科長主持），每季（後勤科科長主持）（C）每月（品標科科長主 持），每季（後勤科科長主持）（D）每月（品標科長主持），每季（修補大隊長主持）。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"28","answer":"D","content":"假設貴官擔任基地時限技令管制人員，如接獲保修指揮部時限技令審查通知後，應立即？（A）通告時限技令執行所屬單位配合器材管制單 位申請所需器材。（B）所需器材及裝具獲補後通知發工管制單位發工執行。（C）運用後勤資訊系統（LIMS）之時限技令管理模組，建立 時限技令管制資料。（D）以上皆是。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"29","answer":"A","content":"假設貴官擔任基地時限技令器材管制人員，接獲時限技令後應執行作為，下列何者為非？（A）按發工管制程序發工。（B）清查本軍庫儲 備份件情況。（C）按補給程序申請所需器材。（D）管制時限技令器材獲補進度。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"30","answer":"C","content":"各單位如因短缺時限技令文件而須申請補充時，應按何種規定程序申請？（A）TO 00-5-1（B）TO 00-5-22（C）CAF 00-5-22（D）空軍修護 管理作業手冊。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"31","answer":"D","content":"本軍各級保有（或支援）武器系統/裝備之修護、補給單位，可依據品管單位發現之缺點，不滿意報告及失事危險事件原因等資料之分析， 向下列哪個單位提出「工程修改建議」，以俾後續該單位審查及自頒本軍時限技術命令？（A）國防部（B）教準部（C）空軍司令部（D） 保修指揮部。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"32","answer":"B","content":"假設貴單位接受到時限為「立即執行」之時限技術命令，且影響裝備為航空裝備，應在該飛機修護表格AFTO 781H表「本日情況」欄中記入 何種符號？（A）紅色/（B）紅色X（C）紅色/（D）紅色-。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"33","answer":"C","content":"關於本軍時限技令之敘述下列何者正確？（A）時限技術命令包含按美軍頒發、國內（外）製造廠商發布、本軍自頒時限技令及陸、海軍負 責修護之裝備均適用於本程序。（B）各基地可依據修管單位發現之缺點，不滿意報告及失事危險事件原因分析，提出工程修改建議。 （C）美軍或其他國內（外）製造廠商對應立即、緊急執行之安全時限技令，應先將以電報技令傳遞方式送（轉）保修指揮部整後組。 （D）對收到之時限技令電報，如電文不清或有疑問者，應先送交教準部技令處印製後，再行洽美軍或其他國內（外）製造廠商查明更正， 以避免耽誤時效。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"34","answer":"B","content":"如所屬航空裝備接收到「立即執行」或「緊急執行」之時限技令，修護人員應將該時限技令號碼、版期登載於何表內？（A）AFTO 781H 表 （B）AFTO 781K表（C）AFTO 95表（D）AFTO 781A表。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"35","answer":"D","content":"如所屬航空裝備接收到「立即執行」或「緊急執行」之時限技令，修護人員應將該時限技令摘要登載於何表內？（A）AFTO 781H 表（B） AFTO 781K表（C）AFTO 95表（D）AFTO 781A表。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"36","answer":"A","content":"針對本軍屬經常執行之時限技令，下列何者敘述有誤？（A）依時限技令項目修改或工作之複雜性，統由基地 CCB 決定執行之主要負責單位 及執行時限。（B）共區分為二類，第一類由使用單位或場站修護單位負責執行；第二類由工廠單位於執行工廠階段修護時執行。（C）以 「安全」時限技令發布應以在收到所需器材後11天至270天內完成為原則。（D）增進使用壽命與維護效能之時限技令應以在收到所需器材 後 30天至360天之內完成為原則。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"37","answer":"D","content":"屬立即、緊急時限技令於執行完成後，除執行者簽證外，並需經何人員於何表格複驗、簽證？（A）分隊長/AFTO 781 表（B）品標科長 /AFTO 781A表（C）品標科科長/AFTO 95表（D）工作單位檢驗人員/AFTO 95表。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"38","answer":"C","content":"時限技術命令資料編碼（Data Code）敘述下列何者正確？（A）總共 7 碼，編排方式為 XXX-XX-XX。（B）前 3 碼為自 001 起之流水碼。 （C）次2 碼為次系統型別。（D）以上皆是。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"39","answer":"B","content":"針對保修指揮部整後組於空軍CCB會議內業務職掌敘述何者有誤？（A）負責CCB定期（每季）及不定期（視需要）會議之召開。（B）負責 督導管制本軍各型飛機、發動機及其相關之武器/裝備時限技令文件、SB 之審查、分類建議與能量鑑定。（C）管制各部隊及專業單位各項 時限技令/服務通報執行所需器材（包）籌（獲）補情況。（D）蒐整各項時限技令/服務通報器材（包）需求量。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"40","answer":"D","content":"時限技術命令之處理及管制，有關各級保有（或支援）武器系統 /裝備之修護、補給單位之職責，下列何者正確？（A）時限技令核定、發 布。（B）時限技令管制政策之制定及有關法規程序之審核。（C）時限技令文件之籌補、複製與分發至各基地主檔。（D）時限技令器材包 及特種工具需求檢討、申請、管制及執行。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"41","answer":"D","content":"針對本軍自頒時限技令中之修改建議審查，針對第 VB 至Ⅵ類之修改，應以修改後將繼續使用多少年以上為限？（A）10 年（B）8 年（C）5 年（D）2 年。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"42","answer":"C","content":"關於本軍時限技令之敘述下列何者正確？（A）時限技術命令包含按美軍頒發、國內（外）製造廠商發布、本軍自頒時限技令及陸、海軍負 責修護之裝備均適用於本程序。（B）各基地可依據修管單位發現之缺點，不滿意報告及失事危險事件原因分析，提出工程修改建議。 （C）本軍使用中之新型/裝備，因美軍或原製造廠商尚陸續有新時限技令頒發者，為避免因本軍自頒時限技令後，而導致衝突情形，故除 對檢查、調整或小修之修改件意外，餘皆循 TCP/CIP 反映美軍或原製造商辦理。（D）對收到之時限技令電報，如電文不清或有疑問者，應 先送交教準部技令處印製後，再行洽美軍或其他國內（外）製造廠商查明更正，以避免耽誤時效。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"43","answer":"D","content":"停飛類本軍自頒時限技令於正式時限技令未印發前，應優先採取何種方式發布？（A）技術通報（B）公文（C）修護通報（D）電報或限時 郵件。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"44","answer":"B","content":"本軍使用中之新型/裝備，因美軍或原製造廠商尚陸續有新時限技令頒發者，為避免因本軍自頒時限技令後，而導致衝突情形，故除對檢 查、調整或小修之修改件意外，餘修改建議皆循何者反映美軍或原廠？（A）ECP/CIP（B）TCP/CIP（C）TCTO/AD（D）SOP/SIP。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"45","answer":"A","content":"針對時限技令審查依據何者正確？（A）美軍已不使用之機型，則以製造商所發布之技術文件為主。（B）商購武器/裝備以FAA/EASA發布之 AD 為本軍執行審查之依據（C）循軍售系統獲得之武器/裝備以廠商發布之工程修改技術文件為準（D）本軍與國內（外）廠商合作生產之武 器/裝備，得視其特性，與相關廠商分別訂定時限技令作業實施細則，並以技術通報頒布執行。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"46","answer":"B","content":"對於國內（外）廠商發布之時限技令技術文件屬持續執行項目且屬舊件修改項目，下列何者正確？（A）由保修指揮部補管組通知料配件總 庫於物料主檔（RIZ）IE 攔加註「P」代號（B）將器材可用件調整為 TB 件（C）須執行修改之受影響件懸掛50G（TB 件）掛籤（須由修管單 位鑑定蓋章）（D）受影響件配合計畫性修護時機或故障送修時執行者可視需要頒佈修護通報。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"47","answer":"B","content":"新接收武器/裝備應清查自接收之日起向前推前至少幾年以上之時限技令資料？（A）1（B）2（C）4（D）5。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"48","answer":"C","content":"針對時限技令審查分類通知單上的審查分類，下列何者正確？（A）REF為建議執行（B）NA為毋須執行（C）R4 為強制（D）R2 為警告。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"49","answer":"D","content":"針對一次性檢查工作，後續如需增列於該型機 T0-6 檢查需求及有關工作卡內，予以繼續定期檢查者，應由品管單位依何者發布規定，並函 送保修指揮部審查發布，並增（修）訂於相關工作卡內？（A）服務通報（B）飛安通報（C）修護通報（D）技術通報。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"50","answer":"A","content":"收到保修指揮部立即、緊急執行之停飛類或安全類等時限技令後，應立即交由誰執行文件翻譯及審查？（A）工作單位（B）修管單位（C） 品管單位（D）生檢單位。"},{"stage":"第二階段","subject":"時限技術命令與管制作業","q_num":"51","answer":"D","content":"修改工作如屬專業（工廠）階層執行，惟本軍尚無能量或不建能量者應由何者主動彙整全軍受影響數量，於簽奉核定後，遵限辦理招商執 行修改？（A）基地CCB（B）基地時限管制小組（C）保指部CCB（D）保指部時限管制小組。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"1","answer":"C","content":"請問ㄧ指部的試裝修校管制單位為何？（A）品標科（B）軍電廠（C）試裝廠（D）陸電廠。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"2","answer":"B","content":"請問三指部的試裝修校管制單位為何？（A）修管科（B）品標科（C）發裝廠（D）發修廠。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"3","answer":"D","content":"請問各基地的試裝修校管制單位為何？（A）空電分隊（B）品標科（C）軍電中隊（D）修管科。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"4","answer":"A","content":"試裝屆校前使用單位因任務需求，可向試裝廠辦理延校申請，並經試裝廠審核可後，得予以延校，惟最多可延校次數為何？（A）一次（B） 二次（C）三次（D）視任務需求而定。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"5","answer":"A","content":"試驗裝備修校權責分類參考技令為何（A）33K-1-100-1（B）33K-1-100-2（C）31K-1-100-1（D）33K-2-100-1。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"6","answer":"D","content":"第ㄧ指部試裝廠每年第幾季辦理「全軍試裝修校管制作業講習」（A）一（B）二（C）三（D）四。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"7","answer":"A","content":"請問壓力表、扭力扳手之修理權責單位為（A）第ㄧ指部試裝廠（B）基地校驗室（C）三指部（D）漢翔公司。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"8","answer":"B","content":"依試裝修、校權責分類「USER 件」屬於（A）需校驗由一指部試裝廠負責維修（B）由使用單位負責修校（C）無需校驗由一指部試裝廠負責 維修（D）無需校驗由使用單位。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"9","answer":"A","content":"下列何者非轄區修校管制單位？（A）一指部品標科（B）三指部品標科（C）各基地修管科（D）一指部試裝廠。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"10","answer":"D","content":"試裝屆校前使用單位因任務需求，可於「TMDE」模組向試裝廠辦理延校申請，審核可得予以延校，最多可延校半個週期，同一裝備僅可延校 乙次，惟最大延校週期不得超過幾個月（A）1 個月（B）3 個月（C）6 個月（D）12 個月。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"11","answer":"A","content":"請問下列何者為 PMEL 件試裝修（校）權責分類（A）由試裝廠及各校驗室負責修、校能量之籌建與維持（B）由使用單位負責校驗，一指部 試裝廠負責維修（C）無需校驗件，由使用單位負責維修（D）無需校驗件，由一指部試裝廠負責維修。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"12","answer":"C","content":"請問下列何者為 NCR/USER 件試裝修（校）權責分類（A）由試裝廠及各校驗室負責修、校能量之籌建與維持（B）由使用單位負責校驗，一 指部試裝廠負責維修（C）無需校驗件，由使用單位負責維修（D）無需校驗件，由一指部試裝廠負責維修。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"13","answer":"B","content":"請問下列何者為 USER/PMEL 件試裝修（校）權責分類（A）由試裝廠及各校驗室負責修、校能量之籌建與維持（B）由使用單位負責校驗，一 指部試裝廠負責維修（C）無需校驗件，由使用單位負責維修（D）無需校驗件，由一指部試裝廠負責維修。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"14","answer":"B","content":"請問馬公地區扭力扳手及壓力類試裝由哪單位負責修校？（A）一指部（B）一聯隊（C）三指部（D）北試股。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"15","answer":"B","content":"第一指部試裝廠具有建立與維持本軍幾級實驗室標準及預算編列等作業之權責？（A）一（B）二（C）三（D）四。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"16","answer":"D","content":"扭力扳手校驗不合格或損壞，嚴禁使用單位直接送第一指部試裝廠修理，應按（A）PMEL件（B）NCR 件（C）故障件（D）修理循環件處理。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"17","answer":"C","content":"試驗裝備因任務需求無法按校正週期如期辦理送校時，辦理延校申請，須於（A）3（B）7（C）14（D）30 天前提出申請。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"18","answer":"A","content":"對於一指部試裝廠支援轄區何者為非（A）廠本部（駐地屏東）負責台中以南（B）北試股（駐地台中）負責台中（含）以北（C）東試股 （駐地花蓮）負責花蓮（D）廠本部（駐地屏東）負責外島地區之各單位。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"19","answer":"C","content":"針對精密量具/精密試驗裝備管制下列何者為空軍司令部之權責？（A）督導全軍精密量具/精密試驗裝備使用及修校工作（B）精密量具/精 密試驗裝備修校預算經費編列與審核（C）全軍精密量具/精密試驗裝備修校政策及制度之制定（D）建立及維繫精密量具/精密試驗裝備循軍 售案外運校驗、追溯及修理之管道。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"20","answer":"D","content":"各級試驗裝備專業修校人員擴訓及技術評鑑與校驗員章核發為何單位權責？（A）保修指揮部（B）基地校驗室（C）空軍司令部（D）第ㄧ指 部試裝廠。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"21","answer":"D","content":"第一指部每年依規定辦理乙次「全軍試裝修校管制作業講習」，下列何者為其規定辦理時間點？（A）一月至三月（B）四月至六月（C）七 月至九月（D）十月至十二月。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"22","answer":"B","content":"由試裝廠及各校驗室負責修、校能量之籌建與維持為（A）USER 件（B）PMEL件（C）AFPSL件（D）CONTRACT件。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"23","answer":"C","content":"依試裝修、校權責分類 NCR／PMEL 件屬於（A）由使用單位負責修校（B）需校驗由一指部試裝廠負責維修（C）無需校驗由一指部試裝廠負 責維修（D）無需校驗由使用單位。"},{"stage":"第三階段","subject":"試驗裝備修校、管制與評鑑作業","q_num":"24","answer":"D","content":"依試裝修、校權責分類屬合約修校件，即招商修校直至本軍建立能量後即行中 指揮體系「一般參謀」（C）幕僚體系「特業參謀」（D）以上皆是。"},{"stage":"第三階段","subject":"修護制度暨階層劃分","q_num":"38","answer":"C","content":"品質促進方面，下列何者為非？（A）品質保證制度（B）全面品質保證制度（C）品質提升制度（D）品質管制制度。"},{"stage":"第三階段","subject":"修護制度暨階層劃分","q_num":"39","answer":"C","content":"使用單位維護作業要項概況，下列何者為非？（A）其他武器、裝備系統之日常檢查及一般維護勤務（B）飛機之飛行前後檢查、時數檢查及 一般維護勤務與基地過境飛機維護（C）對場站及使用單位修護階層之技術輔導及支援協助（D）執行有關之時限技令特別檢查及臨時檢查。"},{"stage":"第三階段","subject":"修護制度暨階層劃分","q_num":"40","answer":"A","content":"執行修護制度於使用單位及場站階層計有？（A）機工長制度、檢查場站制度、專業支援修護制度（B）機工長制度、週檢制度、專業制度 （C）週期檢查制度、飛機維護制度、專業主動修護制度（D）以上皆是。"},{"stage":"第三階段","subject":"修護制度暨階層劃分","q_num":"41","answer":"A","content":"保指部指（督）管區分為何？（A）指揮體系「一般參謀」（B）幕僚體系「特業參謀」（C）以上皆是（D）以上皆非。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"1","answer":"A","content":"新進人員初（調）任新職命令生效，自就職日起、報到後幾週內即接受與單位有關環境介紹、營區管理及地面安全介紹等訓練？（A）1 （B）2（C）3（D）4 週內。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"2","answer":"B","content":"新進人員訓練接受單位組織、管理規定及安全之訓練由聯隊在訓中心負責，訓期以幾日為原則？（A）1至2（B）1至3（C）1至4（D）1 至 5 日。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"3","answer":"A","content":"凡本軍人員初（調）任新職命令生效，自就職日起、報到後幾週內（或完成新進人員訓練後）即接受與編制專長分類有關之訓練施電腦輔助 教學系統？（A）1（B）2（C）3（D）4 週內。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"4","answer":"C","content":"凡本軍人員初（調）任新職命令生效，自就職日起、報到後幾週內（或完成新進人員訓練後）即接受與編制專長分類有關之訓練施電腦輔助 教學系統（CTS），應於專長訓練期間，先行實施幾小時CTS訓練？（A）1（B）5（C）10（D）15 小時。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"5","answer":"D","content":"初（調）任本軍專長職位同時，已獲得是類完全資格專長者，可經由誰考核與建議，並簽奉權責長官核定，免施予在訓？（A）中士（B）上 士（C）士官長（D）基層單位主官（管）考核與建議。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"6","answer":"C","content":"幹部培養訓練，對軍官應以何項之能力培養？（A）參謀作業（B）工作督導管理（C）以上皆是（D）以上皆非。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"7","answer":"C","content":"幹部培養訓練，對士官長應以何項之能力培養？（A）工作督導（B）技術指導（C）以上皆是（D）以上皆非。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"8","answer":"D","content":"對士官兵應以何項之能力培養，以求技能熟練與精進及戰時應變支援，並提升部隊整體訓練實效？（A）在職訓練（B）專精訓練（C）組合 訓練（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"9","answer":"D","content":"配合本軍未來各項作業自動化需求，及資訊系統人員作業能量之立，各部隊應依軟、硬體專長人員之需求規劃資訊專精訓練，並建立官兵何 項之系統作業能力？（A）自動化文書處理作業（B）管理資訊系統（MIS）（C）後勤資訊管理系統（LIMS）（D）以上皆是 等之系統作業 能力。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"10","answer":"C","content":"除另有規定外，專長訓練工作悉依何項規定執行？（A）空軍修護教範（B）空軍補給教範（C）空軍在職訓練教範（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"11","answer":"A","content":"單位所屬技勤人員之在職訓練、駐地訓練暨專精訓練訓練資料（紀錄）均需輸入哪一模組中？（A）後勤訓練管制模組（B）後勤修護管制模 組（C）後勤補給管制模組（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"12","answer":"A","content":"按部隊訓練計畫大綱、上年度修護人員技術評審資料、部隊特殊訓練需求與聯隊年度內各修護專長人員進退預估數，於新年度開始前擬訂之 訓練計畫，稱為？（A）年度訓練計畫（B）每月訓練計畫（C）專案訓練計畫（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"13","answer":"B","content":"依年度訓練計畫、修護分析月報、品管檢驗綜合月報、各單位提之修護資料、重複故障及飛機危險或重大事件、不滿意報告、技術通報等， 擬訂之訓練計畫，稱為？（A）年度訓練計畫（B）每月訓練計畫（C）專案訓練計畫（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"14","answer":"C","content":"依上級指示或部隊實況需要（如經常發生之各項技術空軍飛行部隊修護作業手冊問題），擬訂之訓練計畫，稱為？（A）年度訓練計畫（B） 每月訓練計畫（C）專案訓練計畫（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"15","answer":"A","content":"技勤訓練教官之任用以何方式實施？（A）兼任（B）專任（C）外聘（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"16","answer":"D","content":"技勤訓練教官之任期？（A）1 年（B）2 年（C）3 年（D）無任期限制。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"17","answer":"A","content":"按訓練專長及課程項目，編訂在訓教材及各階段完訓測驗題庫，並由哪一模組管制？（A）技勤訓練管制模組（B）後勤修護管制模組（C） 後勤補給管制模組（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"18","answer":"B","content":"各種技令法規等技術資料應保持在哪一版期，以做為訓練及執行工作之依據？（A）最舊（B）最新（C）中間（D）以上皆可。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"19","answer":"C","content":"各單位有關課程需要之標準實作教具，由哪一科（室）納入施訓督考項目？（A）生檢科（B）補給科（C）品質標準訓練科（室）（D）以上 皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"20","answer":"D","content":"凡新進人員於報到後應幾週內應由聯隊在訓中心安排實施職前安全訓練？（A）4（B）3（C）2（D）1 週內。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"21","answer":"D","content":"新進人員職前安全訓練，其課目應包括？（A）機種介紹（B）地面安全（C）基地組織、主官、營區及一般法令等介紹說明（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"22","answer":"B","content":"屬飛機修護專長者，應於專長訓練期間，先行實施幾小時飛機主系統介紹（CTS訓練）後，再行依各專長專業課程實施訓練？（A）5（B）10 （C）15（D）20 小時。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"23","answer":"C","content":"現職專長人員於調離原職後，接受另一新職工作專長之訓練，專長屬同機種者可不實施何種訓練？（A）ATS（B）BTS（C）CTS（D）DTS 訓 練。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"24","answer":"C","content":"已取得本軍合格專長（或民間相關專長證照）人員調任同專長，實施熟訓。專長屬同機種者可不實施何種訓練？（A）ATS（B）BTS（C）CTS （D）DTS 訓練。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"25","answer":"D","content":"裝備操作人員許可證，其核發範圍為何？（A）具備本職專長或相關證（駕）照人員（B）必需藉由操作相關動力裝備（C）液氧、氮氣手推 車等（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"26","answer":"A","content":"裝備操作人員許可證，為那一種表？（A）AFTO 35表（B）AFTO 36表（C）AFTO 37表（D）AFTO 38表。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"27","answer":"C","content":"凡操作動力裝備之人員，必先經由何種訓練合格後，獲得許可證使可操作？（A）新進人員訓練（B）勞工安全訓練（C）裝備操作訓練（D） 以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"28","answer":"A","content":"經由裝備操作訓練後，訓練紀錄須輸入哪種管制模組中？（A）後勤訓練管制模組（B）後勤修護管制模組（C）後勤補給管制模組（D）以上 皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"29","answer":"C","content":"裝備操作人員許可證訓練，學科測驗及格分數為幾分？（A）60（B）70（C）80（D）90 分。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"30","answer":"C","content":"經裝備操作人員許可證訓練，訓練紀錄輸入訓練管制模組中，學科測驗及格後，由單位造冊向哪一單位申請核發？（A）生檢科（B）補給科 （C）品標科（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"31","answer":"B","content":"裝備操作人員許可證申請名冊由品標科審查後，即送交哪一小組實施裝備操作評鑑？（A）督導小組（B）技術評鑑小組（C）品檢小組（D） 以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"32","answer":"A","content":"新進人員於接受基本軍事（入伍）及學校專長訓練後，分派至工作單位之訓練屬於哪種專長訓練？（A）派訓（B）熟訓（C）轉訓（D）以上 皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"33","answer":"B","content":"現職專長人員於調離原職後，接受另一新職工作專長之訓練（含相同專長調職者），其專長訓練之類別 ？（A）派訓（B）轉訓（C）熟訓 （D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"34","answer":"B","content":"已取得本軍合格專長（或民間相關專長證照）人員調任同專長，應實施何種訓練？（A）派訓（B）熟訓（C）轉訓（D）以上皆是。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"35","answer":"B","content":"裝備操作證如遺失或損毀不堪使用時，應由何人提出書面報告，經單位各級主官（管）核可後，會請直屬品標科辦理補發？（A）裝備保管 人員（B）持有人員（C）任一操作人員（D）以上皆可。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"36","answer":"A","content":"凡持有操作證之人員，毋需每年度經由技術評鑑小組重新鑑定，惟每年排定所需執行之各項裝備學科訓練幾小時？（A）1（B）2（C）3 （D）4 小時。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"37","answer":"C","content":"凡持有操作證之人員，毋需每年度經由技術評鑑小組重新鑑定，惟每年排定所需執行之各項裝備學科訓練，若屬危險機工具之裝備排定幾小 時學科訓練？（A）1（B）2（C）3（D）4 小時。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"38","answer":"C","content":"未持有該項裝備操作證人員不得操作該項裝備，若違反規定並經發現者，列入單位何種缺失，並予以檢討？（A）內部管理缺失（B）工廠安 全缺失（C）修護缺失（D）地安缺失。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"39","answer":"C","content":"聯隊在訓中心納編品標科及各基層單位主官組成考核小組，對各單位多久各實施在訓考核乙次，並將考核結果呈報單位主官核閱？（A）每 月（B）每季（C）每半年（D）每年。"},{"stage":"第三階段","subject":"本軍部隊駐地訓練","q_num":"40","answer":"A","content":"訓練中心按多久期程訓練計畫之表訂課程，不定期赴相關修護單位督檢查課及檢查相關之訓練紀錄？（A）每月（B）每季（C）每半年（D） 每年。"},{"stage":"第三階段","subject":"構型管理概述","q_num":"1","answer":"C","content":"構型管理中構型稽核分為哪幾種方法？（A）6 種（B）5 種（C）4種（D）3種"},{"stage":"第三階段","subject":"構型管理概述","q_num":"2","answer":"D","content":"何謂構型管理之系統評估共有多少工作階段？（A）2 個（B）4 個（C）6個（D）7 個"},{"stage":"第三階段","subject":"構型管理概述","q_num":"3","answer":"D","content":"本軍武器系統之構型管理作業規定中，何謂SRR？（A）需求審查（B）非系統需求審查（C）系統審查（D）系統需求審查"},{"stage":"第三階段","subject":"構型管理概述","q_num":"4","answer":"B","content":"本軍武器系統之構型管理作業規定中，何謂SSR？（A）規格審查（B）軟體規格審查（C）軟體審查（D）非軟體規格審查"},{"stage":"第三階段","subject":"構型管理概述","q_num":"5","answer":"A","content":"本軍武器系統之構型管理作業規定中，何謂SDR？（A）系統設計審查（B）系統審查（C）設計審查（D）非系統設計審查"},{"stage":"第三階段","subject":"構型管理概述","q_num":"6","answer":"B","content":"本軍武器系統構型管理有幾項基準？（A）4 項（B）3項（C）2 項（D）1項"},{"stage":"第三階段","subject":"構型管理概述","q_num":"7","answer":"B","content":"本軍武器系統之構型管理作業規定中，何謂TCP？（A）非技術協調計畫（B）技術協調計畫（C）協調計畫（D）技術計畫"},{"stage":"第三階段","subject":"構型管理概述","q_num":"8","answer":"C","content":"本軍武器系統之構型管理作業規定中，何謂PQDR？（A）產品設計報告（B）產品保證報告（C）產品品質缺陷報告（D）產品規格報告"},{"stage":"第三階段","subject":"構型管理概述","q_num":"9","answer":"B","content":"本軍武器系統之構型管理作業規定中，何謂TRR？（A）非測試備便審查（B）測試備便審查（C）測試審查（D）備便審查"},{"stage":"第三階段","subject":"構型管理概述","q_num":"10","answer":"B","content":"本軍武器系統之構型管理作業規定中，何謂ECP？（A）工程改善建議書（B）工程修改建議書（C）工程設計建議書（D）工程規模建議書"},{"stage":"第三階段","subject":"構型管理概述","q_num":"1 （D）6日（但緊急公文仍須依個案需要之時限內完成）。"},{"stage":"第四階段","subject":"公文寫作","q_num":"5","answer":"B","content":"公文處理時限：速件（A）1（B）3（C）5（D）6天。"},{"stage":"第四階段","subject":"公文寫作","q_num":"6","answer":"B","content":"國軍單位對有隸屬或指揮關係之上級行文時，應使用何種公文類別？（A）令（B）呈（C）函（D）公告。"},{"stage":"第四階段","subject":"公文寫作","q_num":"7","answer":"C","content":"文書處理流程的起點與終點分別為何？（A）擬稿 → 發文（B）收文 → 發文（C）收文 → 歸檔（D）擬辦 → 判行。"},{"stage":"第四階段","subject":"公文寫作","q_num":"8","answer":"C","content":"下列何者不是文書處理程序基本原則？（A）隨到隨辦（B）隨辦隨送（C）隨便發送（D）不得積壓。"},{"stage":"第四階段","subject":"公文寫作","q_num":"9","answer":"C","content":"國軍單位對其他行政機關、國軍同級單位或不相隸屬單位間行文時，應使用何種公文類別？（A）令（B）呈（C）函（D）公告。"},{"stage":"第四階段","subject":"公文寫作","q_num":"10","answer":"C","content":"正本與副本公文在製作時，應使用何種紙張？（A）一般影印紙（B）加註浮水印之紙張（C）標準公文紙（D）電子掃描檔即可。"},{"stage":"第四階段","subject":"公文寫作","q_num":"11","answer":"B","content":"用語簡練，詞句曉暢，分段確實，主題鮮明，屬公文製作何項要求？（A）正確（B）簡明（C）一致（D）迅速。"},{"stage":"第四階段","subject":"公文寫作","q_num":"12","answer":"B","content":"抄本與譯本是否需要加蓋印信或章戳？（A）皆需要（B）皆不需要（C）僅抄本需要（D）僅譯本需要。"},{"stage":"第四階段","subject":"公文寫作","q_num":"13","answer":"A","content":"公文中涉及貨幣量之數字，須註明幣別與單位，下列何者正確？（A）新臺幣5萬8,888元（B）新台幣5萬8,888元（C）5萬8,888元（D） 以上皆可。"},{"stage":"第四階段","subject":"公文寫作","q_num":"14","answer":"C","content":"機密文書使用（A）白色（B）紅色（C）黃色（D）藍色 公文夾，並放入上鎖之密件袋。"},{"stage":"第四階段","subject":"公文寫作","q_num":"15","answer":"C","content":"重要工作提報單注意事項，下列何者有誤？（A）以公文檔案管理系統產製，以不超過 2 頁為原則（B）有書表、附圖，則以附件隨文呈報， 原稿應於3 日內辦理歸檔（C）屬密或機密不可使用（D）屬極機密、絕對機密不可使用。"},{"stage":"第四階段","subject":"公文寫作","q_num":"16","answer":"B","content":"機關首長、單位主官間，上級對下級之稱謂用語用（A）鈞（B）貴（C）本（D）本。"},{"stage":"第四階段","subject":"公文寫作","q_num":"17","answer":"B","content":"重大案件須由對方詳加考慮研辦時，協調會辦應以何種方式辦理？（A）會議協商（B）書面會簽（C）公文協調（D）面洽協商。"},{"stage":"第四階段","subject":"公文寫作","q_num":"18","answer":"A","content":"機關首長、單位主官間，下級對上級之稱謂用語用（A）鈞長（B）貴部（C）本人（D）職。"},{"stage":"第四階段","subject":"公文寫作","q_num":"19","answer":"B","content":"急要或機密文件在收文時，應如何處理？（A）定時集中送交（B）隨收隨送（C）延後登錄（D）交由承辦人自行處理。"},{"stage":"第四階段","subject":"公文寫作","q_num":"20","answer":"B","content":"簽與稿合併簽請核判之擬辦方式，係為（A）簽稿擬辦（B）簽稿併呈（C）以稿代簽（D）先簽後稿。"},{"stage":"第四階段","subject":"公文寫作","q_num":"21","answer":"A","content":"以「簽稿併呈」方式簽擬公文時，應在簽呈或便簽（A）左上角（B）右上角（C）左下角（D）右下角 加註「簽稿併呈」字樣。"},{"stage":"第四階段","subject":"公文寫作","q_num":"22","answer":"D","content":"對某一重要案件須先簽請核定後，再據以辦稿之擬辦方式，係為（A）簽稿擬辦（B）簽稿併呈（C）以稿代簽（D）先簽後稿。"},{"stage":"第四階段","subject":"公文寫作","q_num":"23","answer":"C","content":"公文分文時，若涉及多個單位業務，原則應如何處理？（A）同時分送所有單位（B）由主官親自處理（C）以主辦單位為主，再行會辦（D） 退回原發文單位。"},{"stage":"第四階段","subject":"公文寫作","q_num":"24","answer":"C","content":"母須簽擬逕行辦稿之擬辦方式，於一般案情簡單或例行承轉之案件使用，係為（A）簽稿擬辦（B）簽稿併呈（C）以稿代簽（D）先簽後稿。"},{"stage":"第四階段","subject":"公文寫作","q_num":"25","answer":"A","content":"各級核稿長官對簽、稿如有刪改部分應在原文字上方用（A）○（B）X（C）＝（D）Δ註記，不可塗改。"},{"stage":"第四階段","subject":"公文寫作","q_num":"26","answer":"B","content":"上行文起首語應使用（A）檢送（B）檢呈（C）令發（D）函送。"},{"stage":"第四階段","subject":"公文寫作","q_num":"27","answer":"D","content":"用以說明案情及供核（審）稿長官參酌，所檢附之業經核定、批示及單位來文之文件、物件或規定，係指（A）附表（B）附圖（C）附件 （D）附呈。"},{"stage":"第四階段","subject":"公文寫作","q_num":"28","answer":"D","content":"就主管業務或依據法令規定，向公眾或特定之對象有所宣佈或週知時使用（A）令（B）呈（C）函（D）公告。"},{"stage":"第四階段","subject":"公文寫作","q_num":"29","answer":"A","content":"經批示「先發」或「補呈」之公文，由承辦人於（A）3（B）4（C）5（D）6 日內調借原案補呈（覆）閱；如遇長官長期公勤，則應自長官 回營3 日內完成。"},{"stage":"第四階段","subject":"公文寫作","q_num":"30","answer":"B","content":"分層負責制度的核心精神為何？（A）集中決策（B）逐級授權、分層負責（C）所有案件均由主官核定（D）避免授權。"},{"stage":"第四階段","subject":"公文寫作","q_num":"31","answer":"D","content":"有關「簽」的撰擬，下列何者有誤？（A）視案情繁簡使用「簽」或「便簽」（B）按主旨、說明、擬辦分 3 段式撰擬（C）採用便簽時以條 列式簽擬（D）草擬公文按文別應採結構撰擬。"},{"stage":"第四階段","subject":"公文寫作","q_num":"32","answer":"D","content":"命令性及一般知悉性或例行性事項且需要答復者，應使用下列何者期用語（A）請鑒核（B）請查照惠復（C）請照辦（D）希辦理見復。"},{"stage":"第四階段","subject":"公文寫作","q_num":"33","answer":"C","content":"呈報上級或主管機關、單位審查，以完成該事項法定效力者，應使用下列何者期望用語 ？（A）請備查（B）請查照（C）請核示（D）請照 辦。"},{"stage":"第四階段","subject":"公文寫作","q_num":"34","answer":"B","content":"公文電子交換及資訊安全，主要依據下列何者辦理？（A）各單位自行規定（B）行政院及國軍相關資訊安全規範（C）承辦人個人判斷（D） 僅依公文程式條例。"},{"stage":"第四階段","subject":"公文寫作","q_num":"35","answer":"B","content":"簽稿完成後，若採「簽稿併呈」，其放置順序為何？（A）稿在上，簽在下（B）簽在上，稿在下（C）附件在最上（D）不限順序。"},{"stage":"第四階段","subject":"公文寫作","q_num":"36","answer":"A","content":"附件及附呈應以簽稿內容說明先後順序，由上而下依序排列，標示於文件之右邊緣，並以何種方式裝訂？（A）附件在上，附呈在下（B）附 件在下，附呈在上（C）無須區分，裝訂整齊即可（D）附件在左，附呈在右。"},{"stage":"第四階段","subject":"公文寫作","q_num":"37","answer":"C","content":"一般公文時效管制，「普通件」處理時限為幾日？（A）1 日（B）3日（C）6 日（D）7日。"},{"stage":"第四階段","subject":"公文寫作","q_num":"38","answer":"B","content":"公文一經處理完畢，承辦人應於奉核之日幾日內辦理發文或歸檔？（A）1 日（B）3 日（C）5日（D）7日。"},{"stage":"第四階段","subject":"公文寫作","q_num":"39","answer":"C","content":"國軍同級單位或不相隸屬單位間行文時，應使用哪一種用法？（A）令（B）呈（C）函（D）公告。"},{"stage":"第四階段","subject":"公文寫作","q_num":"40","answer":"C","content":"承辦人就執掌事項，或下級機關首長對上級機關首長有陳述、請示、請求、建議使用哪一種公文類別？（A）函（B）令（C）簽，便簽（D） 報告。"},{"stage":"第四階段","subject":"公文寫作","q_num":"41","answer":"B","content":"「機密」級資訊，限分發至主官編階為（A）少將（B）少校（C）中校（D）上校 級（含）以上之單位。"},{"stage":"第四階段","subject":"公文寫作","q_num":"42","answer":"D","content":"「機密要件」應標示（A）機密等級（B）機密屬性（C）保密期限或解除機密條件（D）以上皆是。"},{"stage":"第四階段","subject":"公文寫作","q_num":"43","answer":"B","content":"文書處理原則中，「把握時間、隨到隨辦」主要強調何者？（A）成本控制（B）行政效率（C）人員考核（D）文件保存。"},{"stage":"第四階段","subject":"公文寫作","q_num":"44","answer":"D","content":"國軍文書檔案主管單位為何者？（A）各級司令部（B）國防部政務辦公室（C）各業務單位（D）人事單位。"},{"stage":"第四階段","subject":"公文寫作","q_num":"45","answer":"C","content":"各級單位對外來文件，原則上應由何單位統一收受？（A）業務單位（B）承辦人員（C）文書單位（D）主官室。 單選題以 1-40 題為主"},{"stage":"第四階段","subject":"作業風險預防","q_num":"1","answer":"A","content":"風險管理融入各項計畫及作業，藉辨識、評估、處理及監測之（A）機制（B）作業（C）控制（D）處置。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"2","answer":"D","content":"風險控制決策者須完全瞭解危險及危險控制之重要性，並可獲得必要（A）支援（B）資訊（C）預算（D）資源。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"3","answer":"C","content":"作業風險管理是可以再次檢驗現有作法安全性與適當性之重要工具，而不是一項（A）工作（B）計畫（C）業務（D）技巧。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"4","answer":"B","content":"風險三個主要層面包括可能性、曝險率及（A）機會（B）嚴重（C）任務（D）以上皆非。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"5","answer":"D","content":"部屬間應建立「直覺有潛在危安或影響任務之風險」立即回報觀念，並不吝於獎勵，以降低非必要之（A）危險（B）危機（C）冒險（D）風 險 。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"6","answer":"B","content":"危險（Hazard）係工作執行上潛在的傷害，為發掘工作中之何項因子（A）危機（B）危險（C）風險（D）危安。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"7","answer":"B","content":"透過評量制度鼓勵所有人員實際應用，將有效提升危險之識別率多少%以上（A）60（B）50（C）80（D）70。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"8","answer":"A","content":"以人員、機器、環境條件、管理、任務五項層面執行鑑別下列何項來源（A）危險（B）危機（C）冒險（D）風險。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"9","answer":"C","content":"由作業規定、技術命令或標準施工程序綜合審視後，訂出下列何項流程。（A）計畫（B）工作（C）作業（D）以上皆非。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"10","answer":"D","content":"若有具該任務特別看法或曾發生風險事件人員，可採訪談方式蒐集下列何項資訊（A）危險（B）危機（C）冒險（D）風險。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"11","answer":"B","content":"評估時必須採用有效之評估工具並創設一整合之風險評估矩陣或風險分級體系表，以評估危險幅度及下列何項 ？（A）深度（B）機率（C） 廣度（D）發生率 。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"12","answer":"D","content":"決策距陣：依相對重要性及估計值衡量，適用下列何項風險決策？（A）中度（B）低度（C）高度（D）極高度。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"13","answer":"C","content":"成本效益：依相對重要性及估計值衡量，適用下列何項風險決策？（A）中度（B）低度（C）高度（D）極高度。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"14","answer":"A","content":"本軍風險管理風險評估等級為以下四種等級，高度、中度、低度及（A）極高度（B）特高度（C）最高（D）以上皆非。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"15","answer":"A","content":"直覺法：依相對重要性及估計值衡量，適用下列何項風險決策？（A）低度（B）高度（C）極高度（D）以上皆非。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"16","answer":"D","content":"促使受到風險控制影響人員有最大可能的參與發展最佳的支援工具與指示發展一條執行風險控制之時間數線，標明主要之（A）目標（B）決 策（C）預畫（D）里程碑。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"17","answer":"B","content":"風險三個主要層面包括可能性、嚴重及（A）機會（B）曝險率（C）任務（D）以上皆非。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"18","answer":"B","content":"風險三個主要層面包括嚴重、曝險率及（A）機會（B）機率（C）任務（D）以上皆非。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"19","answer":"D","content":"程序上指派專人定期針對風險決策計劃執行考核作業，並檢討改善控制風險之成本及效益定期蒐 整風險衡量指標（A）指數（B）數據（C） 參考（D）參數。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"20","answer":"D","content":"執行監督時，應考慮投入下列何項有無相對應的價值？（A）支出（B）預算（C）支援（D）資源 。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"21","answer":"A","content":"變化分析法的步驟為偵測計畫性或非計畫性相關與下列何者間的變化？（A）危險（B）危機（C）冒險（D）風險。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"22","answer":"B","content":"評估時必須採用有效之評估工具並創設一整合之風險評估矩陣或風險分級體系表，以評估危險幅度及（A）深度（B）機率（C）廣度（D）發 生率 。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"23","answer":"D","content":"決定風險控制效果的特殊考量，是針對實際面臨風險之活動及下列何者所應用之風險控制方法 ？（A）工作者（B）班兵（C）人民（D）人 員。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"24","answer":"D","content":"風險評估機率分為五種分別為頻繁、很可能、很少、幾乎不可能及（A）時常（B）少許（C）幾乎（D）偶而。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"25","answer":"D","content":"風險乃是指遭遇危險因素而發生損失之機率與（A）機會（B）嚴重（C）任務（D）幅度。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"26","answer":"B","content":"發展較佳的控制方法直接引用現行較好可行控制方法，降低發展成本將風險控制與與下列何者程序相整合 ？（A）評估（B）作業（C）工作 （D）危機。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"27","answer":"B","content":"邏輯圖表法內含正邏輯圖、負邏輯圖及何項邏輯圖？（A）假設（B）風險事件（C）層序（D）決策。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"28","answer":"C","content":"風險評估幅度區分四種，災難、中等、輕微及（A）重大（B）傷亡（C）嚴重（D）以上皆非。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"29","answer":"C","content":"增加危險因素產生之間隔或距離，降低個人或個別系統之曝險率，是何項分析風險控制方法？（A）避免（B）補償（C）分散（D）減低。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"30","answer":"D","content":"針對執行危險工作的人員發放特別加給及保險，為下列何項風險控制方法？（A）轉移（B）分散（C）減低（D）補償。"},{"stage":"第四階段","subject":"作業風險預防","q_num":"31","answer":"C","content":"將曾經發生之單一或多重危安事件予以綜合，甚至可運用歷史經驗或他人發生之危安事件予以修簡調整，為 下列何者工具？（A）初步危險 分析（B）假設狀況法（C）情境程序法（D）以上皆非"},{"stage":"第四階段","subject":"作業風險預防","q_num":"32","answer":"D","content":"下列何者是將一項工作或任務予以流程化，建立作業時間線，以確保任務的有所構成要素均被探討 ，評估潛藏風險來源。（A）假設狀況 （B）邏輯圖表法（C）變化分析法（D）作業分析圖。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"1","answer":"A","content":"空軍軍便服配戴勳表以幾排為限？（A）一排（B）兩排（C）三排（D）無限制。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"2","answer":"C","content":"依據空軍內部管理工作指導手冊「國軍人員營區內飲酒懲罰參考基準表」，志願役官士兵未經核准攜帶酒精性飲品入營懲處為何？（A） 罰勤一至五日（B）申誡乙次（C）申誡兩次（D）記過乙次。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"3","answer":"C","content":"依性別工作平等法之申復案件，當事人對於決議書有異議時應於收受決議書次日起幾日內以書面方式提出申復？（A）5 日（B）10 日（C） 20 日（D）30 日。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"4","answer":"D","content":"丙式軍便服穿著時間為（A）11 月 1 日至 11 月 30 日（B）12 月 1 日至次年 3 月 31 日（C）4 月 1 日至 4 月 30 日（D）5 月 1 日至 10 月 31 日 。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"5","answer":"C","content":"病假一次不得超過30 日，在1 年內累計病假以幾個月為限？（A）1個月（B）3 個月（C）6 個月（D）無規定。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"6","answer":"B","content":"新進人員報到當日，資安宣教應實施多久？（A）1 小時（B）2 小時（C）4小時（D）1日。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"7","answer":"B","content":"請問士兵懲罰種類中，罰站以立正行之，其時間以幾小時為限？（A）無限制（B）2 小時（C）3 小時（D）4小時。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"8","answer":"B","content":"因配偶分娩，得在不影響公務情形下，給陪產假幾日，且得分次申請，但應於配偶分娩前後幾日 （含例假日）內請畢？（A）10 日（B）15 日（C）30日（D）42 日。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"9","answer":"D","content":"悔過室受罰人員管理，由何部門負責執行、管理？（A）後勤（B）政戰（C）人事（D）行政。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"10","answer":"C","content":"團體之榮譽假，須由何層級以上主官核定，惟各級主官須謹慎核放，不得浮濫？（A）中校（B）上校（C）少將（D）視情況而定。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"11","answer":"D","content":"女性人員分娩前，給予產前檢查假幾日？（A）3日（B）5 日（C）7日（D）8 日。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"12","answer":"B","content":"新進人員到部後，連級主官應於幾日內實施晤談？（A）1 日（B）3日（C）5 日（D）7日。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"13","answer":"C","content":"當颱風警報發布 W 多少時，各級部隊正、副主官須依規定留值（依進入警報範圍區分），並衡量颱風威脅程度，適度召回救災專業及預置兵 力，先行完成救災編組及機具預置派遣？（A）W12（B）W24（C）W36（D）W48。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"14","answer":"A","content":"『國防部災害應變中心』成立時，於幾分鐘內召開「防颱暨救災會議」，並成立「防颱暨災害應變中心」，建立各項防颱作業準備？（A） 30 分鐘（B）60分鐘（C）90 分鐘（D）120分鐘。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"15","answer":"C","content":"違反通資作業規定者，依規定嚴懲，其懲罰引用法規何者錯誤？（A）空軍資訊安全獎懲基準規定（B）國家機密保護法（C）軍風紀保護實 施規定（D）國軍人員違犯保密規定行政懲罰基準表。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"16","answer":"D","content":"有關移動式儲存媒體專碟專用管制規定，下列敘述何者正確？（A）國軍網路專用（以黃色機身標示）（B）網際網路專用（以綠色機身標 示）（C）國軍網路專用（以藍色機身標示）（D）設備管制碟（紅色機身標示）。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"17","answer":"B","content":"各單位電腦設備依國軍資訊資產管理作業規定，密 t":"內部管理實務探討","q_num":"32","answer":"C","content":"有關警監系統管制規定，下列說明何者為非？（A）監視錄影紀錄須保存 90 日以上（B）由專人維管及操作，並採密碼設定或上鎖方式管制 （C）警監影像檔案輸出，須會同駐隊官及通資部門執行（D）調閱警監影像，須登載使用紀錄，由權責主官（管）核准。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"33","answer":"B","content":"下列何者為士官懲罰種類？（A）罰站（B）檢束（C）禁足（D）以上皆非。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"34","answer":"C","content":"軍常服的穿著時機，何者錯誤？（A）晉謁總統或友邦元首（B）參加本國或外國大典或宴（酒）會（C）各種演習或訓練（D）參加重要典禮 或出席其他正式場合。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"35","answer":"D","content":"陸海空軍官、士官辦理不適服的情況，何者為非？（A）因病傷，經檢定不適服現役者（B）年度考績丙上以下或因個人因素一次受記大過二 次以上，經人事評審會考核不適服現役者（C）任官服現役滿一年提出申請，並經人事評審會審定 3 個月內決議（D）半年內累計記過兩次 者。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"36","answer":"C","content":"悔過室受罰人員，由所屬單位召開人評會，於核定之日起幾小時內，由單位幹部向犯過人員之法定代理人、配偶、直系血親、兄弟姐妹之ㄧ 人告知，說明懲罰事實要旨、事由及預期效果，並作成記錄備查？（A）2 小時（B）4 小時（C）24 小時（D）48 小時。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"37","answer":"C","content":"對悔過室受罰人員，直屬主官（管）應於受罰人員送訓幾日內，親赴悔過室實施輔導？（A）1 日（B）2 日（C）3 至7日（D）無限制。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"38","answer":"C","content":"下列有關健康表（心情溫度計）之敘述，何者有誤？（A）指揮部級（含比照）以下人員，每週自我施測簡式健康表（B）簡稱 BSRS-5（C） 第 1 至 5 題總分10 至 15 分或第6題 2 分者，轉介至單位心衛中心輔導協處（D）第1 至 5 題總分15 分以上或第6 題2 分以上者，立即轉介 至國軍醫院身心科評估適處。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"39","answer":"B","content":"單位接受性騷擾申訴案件，有影響人身安全者，應於幾小時內隔離當事人，被申訴人應暫調離原單位，以保護被害人不受到二度傷害？ （A）12 小時（B）24 小時（C）36小時（D）無須隔離。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"40","answer":"D","content":"審議懲罰時，應斟酌下列哪些因素，再確定懲罰種類？（A）行為時所受之刺激（B）行為之手段（C）行為之動機（D）以上皆是。"},{"stage":"第四階段","subject":"內部管理實務探討","q_num":"41","answer":"D","content":"依據空軍內部管理作業手冊規定，下列軍容禮節規定何者有誤？（A）穿著軍便服時，領帶夾位置應與軍便服口袋下緣平齊（B）冬季長袖毛 衣僅限於營區內穿著（C）夾克穿著的時機為每年 12 月 1 日至次年 3 月 31 日（D）本軍製發之軍便帽，於飛行線及維修棚廠工作時均可戴 用。"}];

        let filteredChoices = [];
        let activeChoices = [];
        let userAnswers = [];

        function showScreen(id) {
            ['setup-screen', 'study-screen', 'quiz-screen', 'result-screen'].forEach(s => {
                document.getElementById(s).classList.toggle('hidden', s !== id);
            });
            window.scrollTo(0, 0);
        }

        function init() {
            const stageOrder = ['第一階段', '第二階段', '第三階段', '第四階段'];
            const stages = [...new Set(cleanDB.map(q => q.stage))].sort((a, b) => {
                const ia = stageOrder.indexOf(a), ib = stageOrder.indexOf(b);
                return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
            });

            const stageSelect = document.getElementById('stage-select');
            stages.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                stageSelect.appendChild(opt);
            });

            stageSelect.addEventListener('change', updateSubjects);
            document.getElementById('subject-select').addEventListener('change', updateCounts);
            updateSubjects();
        }

        function updateSubjects() {
            const stage = document.getElementById('stage-select').value;
            const subjects = [];
            cleanDB.forEach(q => {
                if ((stage === 'ALL' || q.stage === stage) && !subjects.includes(q.subject)) {
                    subjects.push(q.subject);
                }
            });

            const subSelect = document.getElementById('subject-select');
            subSelect.innerHTML = '<option value="ALL">全部科目</option>';
            subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                subSelect.appendChild(opt);
            });
            updateCounts();
        }

        function updateCounts() {
            const stage = document.getElementById('stage-select').value;
            const subject = document.getElementById('subject-select').value;
            filteredChoices = cleanDB.filter(q =>
                (stage === 'ALL' || q.stage === stage) &&
                (subject === 'ALL' || q.subject === subject)
            );
            document.getElementById('max-choice').textContent = `目前範圍題庫共 ${filteredChoices.length} 題`;
            const numInput = document.getElementById('num-choice');
            if (filteredChoices.length > 0 && parseInt(numInput.value) > filteredChoices.length) {
                numInput.value = filteredChoices.length;
            }
        }

        function openStudyMode() {
            const stage = document.getElementById('stage-select').value;
            const subject = document.getElementById('subject-select').value;
            document.getElementById('study-title').textContent =
                `題庫解答總覽（${stage === 'ALL' ? '全部階段' : stage} - ${subject === 'ALL' ? '全部科目' : subject}）`;
            document.getElementById('study-search').value = '';
            renderStudyList();
            showScreen('study-screen');
        }

        function renderStudyList() {
            const kw = document.getElementById('study-search').value.trim().toLowerCase();
            const list = kw ? filteredChoices.filter(q => q.content.toLowerCase().includes(kw) || q.subject.toLowerCase().includes(kw)) : filteredChoices;
            document.getElementById('study-count').textContent = `共顯示 ${list.length} 題（綠色底色為正確答案）`;

            const container = document.getElementById('study-content');
            container.innerHTML = list.map((q, idx) => {
                const match = q.content.match(/（A）(.*?)（B）(.*?)（C）(.*?)（D）(.*)$/);
                let bodyHtml = '';
                if (match) {
                    const stem = q.content.slice(0, match.index).trim();
                    const opts = { A: match[1].trim(), B: match[2].trim(), C: match[3].trim(), D: match[4].trim() };
                    bodyHtml = `
                        <div class="q-title">${idx + 1}. ${stem}</div>
                        <div class="study-options">
                            ${['A', 'B', 'C', 'D'].map(k => `
                                <div class="study-opt ${q.answer === k ? 'is-answer' : ''}">
                                    （${k}）${opts[k]} ${q.answer === k ? '✔' : ''}
                                </div>
                            `).join('')}
                        </div>`;
                } else {
                    bodyHtml = `<div class="q-title">${idx + 1}. ${q.content}</div>`;
                }
                return `
                    <div class="question-block">
                        <div class="q-meta">
                            <span class="tag">${q.stage}｜${q.subject} #${q.q_num}</span>
                            <span class="ans-badge">正確答案：${q.answer}</span>
                        </div>
                        ${bodyHtml}
                    </div>`;
            }).join('');
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            let req = parseInt(document.getElementById('num-choice').value) || 40;
            req = Math.max(1, Math.min(req, filteredChoices.length));

            activeChoices = shuffle(filteredChoices).slice(0, req);
            userAnswers = new Array(activeChoices.length).fill(null);

            const container = document.getElementById('quiz-content');
            container.innerHTML = activeChoices.map((q, idx) => `
                <div class="question-block" id="q-block-${idx}">
                    <div class="q-meta">
                        <span class="tag">${q.stage}｜${q.subject} #${q.q_num}</span>
                    </div>
                    <div class="q-title">${idx + 1}. ${q.content}</div>
                    <div class="options">
                        ${['A', 'B', 'C', 'D'].map(opt => `
                            <button class="opt-btn" id="btn-${idx}-${opt}" onclick="selectOption(${idx}, '${opt}')">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            updateProgress();
            showScreen('quiz-screen');
        }

        function selectOption(qIdx, opt) {
            userAnswers[qIdx] = opt;
            ['A', 'B', 'C', 'D'].forEach(o => {
                document.getElementById(`btn-${qIdx}-${o}`).classList.toggle('selected', o === opt);
            });
            updateProgress();
        }

        function updateProgress() {
            const answered = userAnswers.filter(a => a !== null).length;
            document.getElementById('quiz-progress').textContent = `已作答：${answered} / ${activeChoices.length} 題`;
        }

        function submitQuiz() {
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0 && !confirm(`還有 ${unanswered} 題尚未作答，確定要直接交卷嗎？`)) {
                return;
            }

            let correctCount = 0;
            activeChoices.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) correctCount++;
            });

            const score = Math.round((correctCount / activeChoices.length) * 100);
            document.getElementById('final-score').textContent = score;
            document.getElementById('score-detail').textContent =
                `共 ${activeChoices.length} 題，答對 ${correctCount} 題，答錯 ${activeChoices.length - correctCount} 題`;

            const container = document.getElementById('result-content');
            container.innerHTML = activeChoices.map((q, idx) => {
                const uAns = userAnswers[idx];
                const isRight = uAns === q.answer;
                return `
                    <div class="question-block">
                        <div class="q-meta">
                            <span class="tag">${q.stage}｜${q.subject} #${q.q_num}</span>
                            <span class="ans-badge" style="${isRight ? '' : 'background:#fee2e2;color:#991b1b;border-color:#fca5a5;'}">
                                ${isRight ? '✔ 答對' : `✘ 答錯（你的選擇：${uAns || '未作答'}｜正確答案：${q.answer}）`}
                            </span>
                        </div>
                        <div class="q-title">${idx + 1}. ${q.content}</div>
                        <div class="options">
                            ${['A', 'B', 'C', 'D'].map(opt => {
                                let cls = 'opt-btn disabled';
                                if (opt === q.answer) cls += ' correct';
                                else if (opt === uAns && uAns !== q.answer) cls += ' wrong';
                                return `<button class="${cls}">${opt}</button>`;
                            }).join('')}
                        </div>
                    </div>`;
            }).join('');

            showScreen('result-screen');
        }

        window.onload = init;
    </script>
</body>
</html>
